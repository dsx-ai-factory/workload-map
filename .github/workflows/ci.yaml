name: Pull Request

on:
  push:
    branches:
      - main
      - "v[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
      - "v[0-9]+.[0-9]+"
      - "release-[0-9]+.[0-9]+"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Cache bin tools
        uses: actions/cache@v4
        with:
          path: bin
          key: ${{ runner.os }}-bin-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-bin-

      - name: Run checks
        run: make check

      - name: Get golangci-lint version
        run: echo "GOLANGCI_LINT_VERSION=$(grep '^GOLANGCI_LINT_VERSION' Makefile | cut -d'=' -f2 | tr -d ' ')" >> $GITHUB_ENV

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Lint helm chart
        run: make helm-lint

      - name: Validate helm chart renders
        run: make helm-validate
