name: DCO
on: pull_request
jobs:
  dco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Check sign-off
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} --no-merges); do
            git log -1 --format=%B $c | grep -qE '^Signed-off-by: [^<>]*[^<>[:space:]] <[^<>@[:space:]]+@[^<>@[:space:]]+\.[^<>@[:space:]]+>[[:space:]]*$' || { echo "Missing sign-off: $c"; exit 1; }
          done
