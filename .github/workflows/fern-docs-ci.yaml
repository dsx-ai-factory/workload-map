# Validates the Fern docs configuration on pull requests that change docs/ or fern/.
# It holds no secrets, so it also runs for pull requests from forks.

name: Fern Docs CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-ci.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fern-check:
    name: Fern Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'

      # The version comes from the committed config. It is validated as semver
      # first, because `npm install <pkg>@<spec>` also accepts URL specs.
      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::fern/fern.config.json .version '$VERSION' is not a valid semver"
            exit 1
          fi
          npm install -g --ignore-scripts "fern-api@${VERSION}"

      - name: Fern check
        working-directory: ./fern
        run: fern check
