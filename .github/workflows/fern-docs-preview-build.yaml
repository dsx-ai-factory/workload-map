# Workflow 1 of 2 for Fern docs previews.
#
# Collects the Fern sources and the PR metadata and uploads them as an artifact.
# It holds no secrets, so it is safe to run on pull request code. The companion
# workflow (fern-docs-preview-comment.yaml) runs after this one, builds the
# preview with the Fern token, and posts the link on the PR.
#
# Pull requests from forks are skipped, because the companion workflow needs a
# secret that forks cannot use.

name: "Preview Fern Docs: Build"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/fern-docs-preview-build.yaml'
      - '.github/workflows/fern-docs-preview-comment.yaml'

permissions:
  contents: read

jobs:
  collect:
    name: Collect Fern docs inputs
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Save PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mkdir -p preview-metadata
          printf '%s\n' "$PR_NUMBER" > preview-metadata/pr_number
          printf '%s\n' "$HEAD_REF" > preview-metadata/head_ref
          git diff --name-only "origin/${BASE_REF}...HEAD" -- '*.md' '*.md' > preview-metadata/changed_md_files || true

      - name: Upload Fern docs inputs and metadata
        uses: actions/upload-artifact@v4
        with:
          name: fern-preview
          path: |
            fern/
            docs/
            preview-metadata/
          retention-days: 1
