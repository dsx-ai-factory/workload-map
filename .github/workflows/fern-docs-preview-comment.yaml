# Workflow 2 of 2 for Fern docs previews (see fern-docs-preview-build.yaml).
#
# Runs after "Preview Fern Docs: Build" completes. GitHub runs it from the
# default branch, so it has the Fern token even when the PR comes from a fork.
# It never runs code from the PR. It:
# 1. Checks out the trusted files from the default branch.
# 2. Copies only the PR's docs folder on top of them.
# 3. Builds the preview with the Fern token and posts the link on the PR.
#
# A change to fern/ (for example a new navigation entry) shows in the preview
# only after it is merged, because the preview uses the default branch's fern/.
#
# Required configuration:
# - Organization secret FERN_TOKEN (the Fern token for the nvidia Fern org)

name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Preview Fern Docs: Build"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build preview and comment
    if: github.repository == 'dsx-ai-factory/workload-map' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download docs and metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fern-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The artifact comes from the PR, so its values are checked before use.
      # The PR number must belong to a PR whose latest commit is the one that
      # was built. This also skips a build that a newer push has replaced.
      - name: Read and check PR metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(head -n1 preview-metadata/pr_number)
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::pr_number must be numeric"; exit 1; }
          CURRENT_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          if [ "$CURRENT_SHA" != "$BUILT_SHA" ]; then
            echo "::notice::The build is for ${BUILT_SHA}, but PR #${PR_NUMBER} is at ${CURRENT_SHA}. Skipping this preview."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      # A link in the PR's docs folder could point to a file on the runner.
      - name: Reject symbolic links in the docs folder
        if: steps.metadata.outputs.stale == 'false'
        run: |
          set -euo pipefail
          LINKS=$(find docs -type l)
          if [ -n "$LINKS" ]; then
            echo "::error::The docs folder contains symbolic links:"
            echo "$LINKS"
            exit 1
          fi

      # The docs link to files across the repository, so the preview builds from
      # the whole trusted tree.
      - name: Checkout the trusted tree from the default branch
        if: steps.metadata.outputs.stale == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          path: trusted

      - name: Overlay the PR's docs folder on the trusted tree
        if: steps.metadata.outputs.stale == 'false'
        run: |
          set -euo pipefail
          rm -rf trusted/docs
          cp -R docs trusted/docs

      # The trusted tree lacks files that the PR adds outside docs/, so links to
      # them read as broken here. The Fern Docs CI check on the PR is the gate.
      - name: Let the preview warn about broken links
        if: steps.metadata.outputs.stale == 'false'
        working-directory: ./trusted/fern
        run: yq -i '.check.rules.broken-links = "warn"' docs.yml

      - name: Set up Node.js
        if: steps.metadata.outputs.stale == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 'lts/*'

      # `npm install <pkg>@<spec>` also accepts URL specs, so the version is
      # validated as semver first.
      - name: Install Fern CLI
        if: steps.metadata.outputs.stale == 'false'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version trusted/fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::fern/fern.config.json .version '$VERSION' is not a valid semver"
            exit 1
          fi
          npm install -g --ignore-scripts "fern-api@${VERSION}"

      - name: Generate preview URL
        id: generate-docs
        if: steps.metadata.outputs.stale == 'false'
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
        working-directory: ./trusted/fern
        run: |
          set -euo pipefail
          # One stable preview per PR. The id comes from the PR number, not from the branch name.
          PREVIEW_ID="pr-${PR_NUMBER}"

          # Fern can print a URL and still fail, so capture the output before checking the exit status.
          set +e
          OUTPUT=$(fern generate --docs --preview --force --id "$PREVIEW_ID" 2>&1)
          FERN_EXIT=$?
          set -e
          echo "$OUTPUT"

          if [ "$FERN_EXIT" -ne 0 ]; then
            echo "::error::Fern preview generation failed (exit ${FERN_EXIT}). See the Fern output above."
            exit "$FERN_EXIT"
          fi

          URL=$(echo "$OUTPUT" | grep -oE 'Published docs to https?://[^[:space:]()]+' | head -1 | sed 's/^Published docs to //') || true
          if [ -z "$URL" ]; then
            echo "::error::Fern exited successfully without a preview URL. See the Fern output above."
            exit 1
          fi
          if ! printf '%s' "$URL" | grep -qE '^https://[a-zA-Z0-9._-]+\.buildwithfern\.com(/|$)'; then
            echo "::error::Unexpected preview URL host (expected buildwithfern.com): ${URL}"
            exit 1
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      # The token goes only to the preview URL, which was checked to be on buildwithfern.com.
      - name: Build page links for changed Markdown files
        id: page-links
        if: steps.metadata.outputs.stale == 'false'
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
        run: |
          CHANGED_FILES=""
          if [ -f preview-metadata/changed_md_files ]; then
            CHANGED_FILES=$(cat preview-metadata/changed_md_files)
          fi

          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BASE_URL=$(echo "$PREVIEW_URL" | grep -oE 'https?://[^/]+')
          FILES_PARAM=$(echo "$CHANGED_FILES" | tr '\n' ',' | sed 's/,$//' \
            | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=',/'))")
          RESPONSE=$(curl -sf -H "FERN_TOKEN: $FERN_TOKEN" "${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}" 2>/dev/null) || {
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          }

          PAGE_LINKS=$(echo "$RESPONSE" | jq -r --arg url "$BASE_URL" \
            '.mappings[] | select(.slug != null) | "- [\(.slug)](\($url)/\(.slug))"')

          if [ -n "$PAGE_LINKS" ]; then
            { echo "page_links<<EOF"; echo "$PAGE_LINKS"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "page_links=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update the PR comment
        if: steps.metadata.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
          PAGE_LINKS: ${{ steps.page-links.outputs.page_links }}
        run: |
          set -euo pipefail
          MARKER="<!-- preview-docs -->"
          BODY="**Preview your docs:** <${PREVIEW_URL}>"
          if [ -n "${PAGE_LINKS}" ]; then
            BODY="${BODY}"$'\n\n'"Pages changed in this PR:"$'\n'"${PAGE_LINKS}"
          fi
          BODY="${BODY}"$'\n\n'"${MARKER}"

          # Search every page of comments, so that an existing preview comment is found on a busy PR.
          COMMENT_ID=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi
