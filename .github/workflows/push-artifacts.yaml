name: Upload artifacts to GitHub Container Registry
on:
  push:
    branches: [ main ]
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write


jobs:
  build-and-push:
    name: Build & Push Helm Chart and Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            go.sum
            operator/go.sum
            cli/go.sum

      - name: Install helm
        uses: azure/setup-helm@v5

      - name: Set package version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "Tag release: using the tag as the version (strip leading 'v' if present)"
            PACKAGE_VERSION=${GITHUB_REF_NAME#v}
          else
            echo "Push to main: dev build keyed off the commit sha"
            PACKAGE_VERSION=0.0.0-main-$(git rev-parse --short HEAD)
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"

      - name: Set registry namespace
        run: |
          # Derive from the repo owner so a fork publishes to its own ghcr
          # namespace. ghcr requires lowercase, and an owner can be mixed case.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_NAMESPACE="ghcr.io/${OWNER}/workload-map"
          echo "REGISTRY_NAMESPACE=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "HELM_REGISTRY=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "Publishing artifacts to $REGISTRY_NAMESPACE"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify version not already published
        run: |
          if helm show chart oci://${{ env.HELM_REGISTRY }}/karta --version "$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already published to ${{ env.HELM_REGISTRY }}/karta." >&2
            exit 1
          fi

      - name: Lint and validate helm chart
        run: make helm-lint helm-validate

      - name: Run checks
        if: github.ref_type == 'tag'
        run: make check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push operator image
        run: |
          make operator-image-buildx-push VERSION="$PACKAGE_VERSION" IMAGE_REGISTRY="$REGISTRY_NAMESPACE"

      - name: Generate air-gap image lock
        if: github.ref_type == 'tag'
        run: |
          # After the operator push so its tag resolves; PACKAGE_VERSION has no leading v.
          make image-lock VERSION="$PACKAGE_VERSION" \
            IMAGE_LOCK_SET="image.repository=$REGISTRY_NAMESPACE/karta-operator"

      - name: Build helm chart
        run: |
          helm package ./charts/karta -d ./charts \
            --version "$PACKAGE_VERSION" \
            --app-version "$PACKAGE_VERSION"

      - name: Push Helm Chart
        run: |
          helm push ./charts/karta-$PACKAGE_VERSION.tgz oci://${{ env.HELM_REGISTRY }}

      - name: Upload chart as release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            charts/karta-${{ env.PACKAGE_VERSION }}.tgz
            dist/imagelock-karta-v${{ env.PACKAGE_VERSION }}-linux-amd64.yaml
            dist/imagelock-karta-v${{ env.PACKAGE_VERSION }}-linux-arm64.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
