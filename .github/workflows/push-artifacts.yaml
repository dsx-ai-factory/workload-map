name: Upload artifacts to GitHub Container Registry
on:
  push:
    branches: [ main ]
  # A release runs when its GitHub Release is released, not when its tags are
  # pushed: vX.Y.Z and karta/vX.Y.Z are pushed first, then the release is
  # published from the existing vX.Y.Z tag. `released` fires when a full
  # release is published or a prerelease is changed to a full release. A draft
  # or a prerelease fires nothing, so a release published as a prerelease by
  # mistake starts when the box is unchecked.
  release:
    types: [ released ]

permissions:
  contents: write
  packages: write


jobs:
  build-and-push:
    name: Build & Push Helm Chart and Operator Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: |
            karta/go.sum
            operator/go.sum
            cli/go.sum
            hack/release/go.sum

      - name: Install helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Set package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            echo "Release: using its tag as the version (strip the leading 'v')"
            PACKAGE_VERSION=${RELEASE_TAG#v}
          else
            echo "Push to main: dev build keyed off the commit sha"
            PACKAGE_VERSION=0.0.0-main-$(git rev-parse --short HEAD)
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION"

      - name: Set registry namespace
        run: |
          # Derive from the repo owner so a fork publishes to its own ghcr
          # namespace. ghcr requires lowercase, and an owner can be mixed case.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY_NAMESPACE="ghcr.io/${OWNER}/workload-map"
          echo "REGISTRY_NAMESPACE=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "HELM_REGISTRY=$REGISTRY_NAMESPACE" >> $GITHUB_ENV
          echo "Publishing artifacts to $REGISTRY_NAMESPACE"

      # Before the publication check: helm reads the Docker credential store, and
      # a ghcr package is private until someone makes it public. Unauthenticated,
      # a published private chart reads as absent and the guard would let the run
      # overwrite it.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check published version
        id: publication
        run: |
          if ! chart=$(helm show chart oci://${{ env.HELM_REGISTRY }}/karta --version "$PACKAGE_VERSION" 2>/dev/null); then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${GITHUB_RUN_ATTEMPT:-1}" == "1" ]]; then
            echo "Version $PACKAGE_VERSION already published to ${{ env.HELM_REGISTRY }}/karta." >&2
            exit 1
          fi
          printf '%s\n' "$chart" | grep -Fxq "version: $PACKAGE_VERSION" || {
            echo "Published chart version does not match $PACKAGE_VERSION." >&2
            exit 1
          }
          printf '%s\n' "$chart" | grep -Fxq "appVersion: $PACKAGE_VERSION" || {
            echo "Published chart appVersion does not match $PACKAGE_VERSION." >&2
            exit 1
          }
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "Reusing version $PACKAGE_VERSION from the previous workflow attempt."

      - name: Lint and validate helm chart
        run: make helm-lint helm-validate

      # Before anything is published: without the karta/vX.Y.Z tag on this
      # commit, the image and chart would ship and only `make release` would fail.
      - name: Validate release version, library module, and release tags
        if: github.event_name == 'release'
        run: make release-validate VERSION="$PACKAGE_VERSION" REQUIRE_TAGS=1

      - name: Run checks
        if: github.event_name == 'release'
        run: make check VERSION="$PACKAGE_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push operator image
        if: steps.publication.outputs.published != 'true'
        run: |
          make operator-image-buildx-push VERSION="$PACKAGE_VERSION" IMAGE_REGISTRY="$REGISTRY_NAMESPACE"

      - name: Build helm chart
        if: steps.publication.outputs.published != 'true'
        run: |
          helm package ./charts/karta -d ./charts \
            --version "$PACKAGE_VERSION" \
            --app-version "$PACKAGE_VERSION"

      - name: Pull published helm chart
        if: steps.publication.outputs.published == 'true'
        run: |
          # A rerun attaches the chart the first attempt published rather than a
          # fresh package of it. `helm package` records file times, so building
          # the same chart again yields different bytes, and the release asset
          # would stop matching the chart in the registry.
          helm pull oci://${{ env.HELM_REGISTRY }}/karta \
            --version "$PACKAGE_VERSION" -d ./charts

      - name: Push Helm Chart
        if: steps.publication.outputs.published != 'true'
        run: |
          helm push ./charts/karta-$PACKAGE_VERSION.tgz oci://${{ env.HELM_REGISTRY }}

      # GoReleaser finds the published release by its tag and uploads to it,
      # keeping the notes written for it (release.mode in .goreleaser.yaml).
      - name: Publish CLI release assets
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release VERSION="$PACKAGE_VERSION"

      - name: Generate air-gap image lock
        if: github.event_name == 'release'
        run: |
          # Run after GoReleaser because `release --clean` recreates dist/.
          make image-lock VERSION="$PACKAGE_VERSION" \
            IMAGE_LOCK_SET="image.repository=$REGISTRY_NAMESPACE/karta-operator"

      - name: Attach chart and image locks to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            "charts/karta-$PACKAGE_VERSION.tgz" \
            "dist/imagelock-karta-v$PACKAGE_VERSION-linux-amd64.yaml" \
            "dist/imagelock-karta-v$PACKAGE_VERSION-linux-arm64.yaml"
