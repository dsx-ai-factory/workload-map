{{- $tag := .TagName }}
{{- $version := slice $tag 1 }}
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kli
spec:
  version: "{{ $tag }}"
  homepage: https://github.com/dsx-ai-factory/workload-map
  shortDescription: Show workload components and status
  description: |
    Use Karta definitions to show a workload's component tree, normalized
    status, and resource requests by role. For example, see leader and
    worker roles in a LeaderWorkerSet or preview its manifest offline.
  platforms:
  - selector:
      matchLabels: {os: darwin, arch: amd64}
    {{ addURIAndSha (printf "https://github.com/dsx-ai-factory/workload-map/releases/download/%s/karta_%s_darwin_amd64.tar.gz" $tag $version) $tag }}
    bin: kli
  - selector:
      matchLabels: {os: darwin, arch: arm64}
    {{ addURIAndSha (printf "https://github.com/dsx-ai-factory/workload-map/releases/download/%s/karta_%s_darwin_arm64.tar.gz" $tag $version) $tag }}
    bin: kli
  - selector:
      matchLabels: {os: linux, arch: amd64}
    {{ addURIAndSha (printf "https://github.com/dsx-ai-factory/workload-map/releases/download/%s/karta_%s_linux_amd64.tar.gz" $tag $version) $tag }}
    bin: kli
  - selector:
      matchLabels: {os: linux, arch: arm64}
    {{ addURIAndSha (printf "https://github.com/dsx-ai-factory/workload-map/releases/download/%s/karta_%s_linux_arm64.tar.gz" $tag $version) $tag }}
    bin: kli
