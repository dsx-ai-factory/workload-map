{{- /*
Matches only the resource types: namespace and object selectors, exclusions and
matchConditions scope capture, so narrowing them never lifts protection from an
annotation that was already captured.
*/}}
{{- $s := .Values.admissionPolicies.submitter }}
{{- if $s.immutable }}
{{- include "karta.submitter.requireVAP" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "karta.submitter.immutableName" . }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      {{- include "karta.submitter.resourceRules" (dict "rules" $s.resources "operation" "UPDATE" "subresources" true "field" "admissionPolicies.submitter.resources") | trim | nindent 6 }}
  matchConditions:
    # Skips the validation for objects that never carried the annotation.
    - name: karta-submitter-captured
      expression: 'has(oldObject.metadata.annotations) && "karta.run.ai/submitted-by" in oldObject.metadata.annotations'
  validations:
    - expression: 'has(object.metadata.annotations) && "karta.run.ai/submitted-by" in object.metadata.annotations && object.metadata.annotations["karta.run.ai/submitted-by"] == oldObject.metadata.annotations["karta.run.ai/submitted-by"]'
      message: karta.run.ai/submitted-by is immutable
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "karta.submitter.immutableName" . }}
  labels:
    {{- include "karta.labels" . | nindent 4 }}
spec:
  policyName: {{ include "karta.submitter.immutableName" . }}
  validationActions: [Deny]
{{- end }}
