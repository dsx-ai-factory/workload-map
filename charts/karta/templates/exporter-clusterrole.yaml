{{- if .Values.exporter.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "karta.exporter.clusterScopedName" . }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
rules:
  {{- if .Values.exporter.kartaDefinitionSource.cluster.enabled }}
  # Read the cluster's Karta definitions; the inventory only lists and watches.
  - apiGroups: ["run.ai"]
    resources: ["kartas"]
    verbs: ["list", "watch"]
  {{- end }}
  # Pods supply ownership and labels. Namespace labels select observation scope.
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["list", "watch"]
  {{- range .Values.exporter.rbac.workloadRules }}
  - apiGroups: {{ .apiGroups | toJson }}
    resources: {{ .resources | toJson }}
    verbs: ["list", "watch"]
  {{- end }}
{{- end }}
