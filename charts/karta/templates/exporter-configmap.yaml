{{- if and .Values.exporter .Values.exporter.enabled }}
{{- /* A null would drop the Karta RBAC while the exporter defaults the cluster source on. */}}
{{- if not (kindIs "bool" .Values.exporter.kartaDefinitionSource.cluster.enabled) }}
{{- fail "exporter.kartaDefinitionSource.cluster.enabled must be true or false" }}
{{- end }}
{{- $exporter := .Values.exporter }}
{{- range $name := list "selection" "metrics" "tuning" }}
  {{- if not (kindIs "map" (index $exporter $name)) }}
    {{- fail (printf "exporter.%s must be a map" $name) }}
  {{- end }}
{{- end }}
{{- range $name := list "workers" "apiClient" }}
  {{- if not (kindIs "map" (index $exporter.tuning $name)) }}
    {{- fail (printf "exporter.tuning.%s must be a map" $name) }}
  {{- end }}
{{- end }}
{{- /* The exporter reads file paths; the Secret name is chart-only. */}}
{{- $metrics := omit $exporter.metrics "delivery" }}
{{- if include "karta.exporter.tlsSecret" . }}
  {{- $dir := include "karta.exporter.tlsDir" . }}
  {{- $tls := dict "certFile" (printf "%s/tls.crt" $dir) "keyFile" (printf "%s/tls.key" $dir) }}
  {{- $_ := set $metrics "delivery" (dict "prometheus" (dict "tls" $tls)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    selection:
      {{- toYaml $exporter.selection | nindent 6 }}
    kartaDefinitionSource:
      {{- toYaml $exporter.kartaDefinitionSource | nindent 6 }}
    metrics:
      {{- toYaml $metrics | nindent 6 }}
    tuning:
      {{- omit $exporter.tuning "goMemoryLimit" "pprof" | toYaml | nindent 6 }}
{{- end }}
