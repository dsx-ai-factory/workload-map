{{- if and .Values.exporter .Values.exporter.enabled }}
{{- $fipsMode := include "karta.fipsMode" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "karta.exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels := include "karta.exporter.selectorLabels" . | fromYaml }}
        {{- mergeOverwrite (deepCopy .Values.exporter.podLabels) $selectorLabels | toYaml | nindent 8 }}
      annotations:
        {{- with omit .Values.exporter.podAnnotations "checksum/config" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # Roll the Pod when the config changes; the file is read once at startup.
        checksum/config: {{ include (print $.Template.BasePath "/exporter-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "karta.exporter.fullname" . }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.exporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.exporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dsx-workload-exporter
          image: "{{ required "exporter.image.repository is required" .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.metricsPort }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          args:
            - --config=/etc/dsx-workload-exporter/config.yaml
            - {{ printf "--metrics-bind-address=:%v" .Values.exporter.metricsPort | quote }}
            {{- if dig "pprof" "enabled" false .Values.exporter }}
            - {{ printf "--pprof-bind-address=127.0.0.1:%v" (dig "pprof" "port" 6060 .Values.exporter) | quote }}
            {{- end }}
          {{- if ne $fipsMode "off" }}
          env:
            - name: GODEBUG
              value: "fips140={{ $fipsMode }}"
          {{- end }}
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/dsx-workload-exporter
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: {{ include "karta.exporter.fullname" . }}
{{- end }}
