{{- if .Values.exporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "karta.exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karta.exporter.labels" . | nindent 4 }}
  {{- with .Values.exporter.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Keep diagnostic metrics reachable while required watches are unhealthy.
  publishNotReadyAddresses: true
  selector:
    {{- include "karta.exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.exporter.metricsPort }}
      targetPort: metrics
{{- end }}
