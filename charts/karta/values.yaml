# Default values for the karta operator chart.
# Override with --set key=value or -f my-values.yaml.

global:
  # Go FIPS 140-3 runtime mode: off, on, or only. See docs/configuration/karta-operator/run-in-fips-mode.mdx.
  fipsMode: "off"

# Set false to skip the operator workload.
operator:
  enabled: true

# Standalone metrics exporter with /metrics, /healthz and /readyz.
exporter:
  enabled: false

  # Choose namespaces, workload roots, Pods and owner kinds to observe.
  selection:
    # Skip Kubernetes system namespaces. Set matchExpressions: [] to include them.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - kube-system
            - kube-public
            - kube-node-lease
    # Allowed workload root types. An empty list allows all types.
    includeRootResources: []
    # Skip ConfigMaps and Secrets as workload roots. RBAC is unchanged.
    # Set [] to allow them as workload roots.
    excludeRootResources:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: ["configmaps", "secrets"]
    # Label filters for workload roots. Omit apiVersion and kind for a global filter.
    # All applicable filters must match. An empty list allows every root.
    rootSelectors: []
    # Select Pods for attribution rows. All Pods are watched.
    podSelector: {}
    # Stop owner traversal before a kind in this list.
    ignoredOwnerKinds: []
    # Watch these kinds even without a selected Karta definition.
    requiredWatchKinds: []

  # Select Karta definitions by name. Empty includes allow all names. Exclusions win.
  # For each workload kind, a selected cluster definition overrides the catalog.
  kartaDefinitionSource:
    # Allow spec.experimental definitions from either source. Includes do not
    # override this gate. Stable definitions remain enabled by default.
    enableExperimental: false
    # Definitions built into the exporter, named as in docs/catalog, for
    # example batch-job-v1. Unknown names fail startup.
    catalog:
      enabled: true
      include: []
      exclude: []
    # Watch Karta objects in the cluster, named by metadata.name.
    cluster:
      enabled: true
      include: []
      exclude: []

  # Choose which series and labels the exporter publishes.
  metrics:
    # Select roots that publish workload status and creation time. Pod info remains.
    workloadSelector: {}
    # Omit transition phases. Set [] to emit all phases, including transitions
    # used by the Sandbox catalog definition and custom definitions.
    excludeStatuses: [Suspending, Resuming]
    # Extra labels for Pod info and workload status. Expressions read object.
    # See dsx-workload-exporter/pkg/labelevaluator/README.md.
    labelRules: []
    # Optional bare-Pod metric association. The selected target Karta supplies its
    # watch; target ownerReferences must include the Pod name and current UID.
    podWorkloadAssociation: null
    # Shared generic label evaluation limits. Zero selects the default.
    labelEvaluationLimits:
      costLimit: 10000
      maxExpressionBytes: 4096
      maxResultBytes: 1024

  # Shared listener, container and Service port for metrics and health endpoints.
  metricsPort: 8080

  # Requires an existing Prometheus Operator and ServiceMonitor CRD.
  serviceMonitor:
    enabled: false
    # Match the labels selected by your Prometheus instance.
    additionalLabels: {}
    # Empty values inherit the Prometheus scrape settings.
    interval: ""
    scrapeTimeout: ""

  rbac:
    # The default grants list/watch on all resources, including Secrets.
    # To choose resources for your cluster, run:
    #   kubectl api-resources --verbs=list,watch
    # Use NAME under resources. For apiGroups, use apps for apps/v1 or "" for v1.
    # Include each watched workload and every controller owner up to its root.
    # For a Pod owned by a ReplicaSet owned by a Deployment, Pods are already granted:
    #   - apiGroups: ["apps"]
    #     resources: ["deployments", "replicasets"]
    # Also grant access to kinds selected by kartaDefinitionSource and
    # selection.requiredWatchKinds. The default catalog includes batch/jobs.
    # Inspect the live chain in your namespace (default in this example):
    #   kubectl get pods,rs,deploy -n default -o yaml
    # Follow the metadata.ownerReferences entry with controller: true at each step.
    workloadRules:
      - apiGroups: ["*"]
        resources: ["*"]

  image:
    repository: ghcr.io/dsx-ai-factory/workload-map/dsx-workload-exporter
    # When empty, falls back to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Tune for watched object count, object size and scrape frequency.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Selector labels and checksum/config are reserved and cannot be overridden.
  podLabels: {}
  podAnnotations: {}
  service:
    annotations: {}

  # Queue workers, Kubernetes API client limits and Go runtime settings.
  tuning:
    workers:
      # Number of workers for each queue unless overridden below.
      default: 4
      # Zero uses the default above.
      pods: 0
      workloads: 0
    apiClient:
      # Timeout for resource discovery and each LIST page.
      requestTimeout: 30s
      qps: 20
      burst: 40
    # auto sets GOMEMLIMIT to 90% of the container memory limit.
    # Fixed limits accept M, G, Mi or Gi, such as 500M, 512Mi or 3.5Gi.
    # Use up to three decimal places, from 1Mi through 1024Gi.
    # Empty, null, or auto without a positive container limit leaves GOMEMLIMIT unset.
    goMemoryLimit: auto
    # Serve Go profiles on localhost for kubectl port-forward.
    pprof:
      enabled: false
      port: 6060

# Overrides for resource names. Rarely needed.
fullnameOverride: ""

# Keep at 1 unless leaderElection.enabled is true; without leader election
# multiple replicas would reconcile concurrently.
replicaCount: 1

# When enabled, only the replica holding the lease reconciles (active/passive).
# The chart also creates a namespaced Role/RoleBinding for the lease object.
leaderElection:
  enabled: false
  id: karta-operator.run.ai

image:
  repository: ghcr.io/dsx-ai-factory/workload-map/karta-operator
  # When empty, falls back to .Chart.AppVersion so chart and image versions
  # stay in lockstep.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registries.
imagePullSecrets: []

# Pod annotations (e.g. Prometheus scrape hints).
podAnnotations: {}

serviceAccount:
  # Set false to use an externally managed ServiceAccount (set name below).
  create: true
  # Only used when create: false — name of the externally managed SA.
  name: ""

ports:
  metrics: 8080
  health: 8081

webhook:
  enabled: true
  port: 9443
  cert:
    # auto: the operator self-signs and rotates the serving cert (no cert-manager).
    # manual: certs are supplied externally (cert-manager, an admin, ...); the
    #   operator only reads the mounted Secret and never touches the cert.
    provisionMode: auto
    # manual mode only: a static CA bundle to stamp on the webhook configs.
    caBundle: ""
    # manual mode only: annotations for the webhook configs. Wire cert-manager
    # here, e.g. cert-manager.io/inject-ca-from: <namespace>/<certificate-name>
    annotations: {}

# Native admission policies, run by the API server. They need neither the
# operator nor the exporter, so operator.enabled does not affect them.
admissionPolicies:
  # Records the authenticated caller that creates a workload in an annotation,
  # best effort.
  submitter:
    # A MutatingAdmissionPolicy fills a missing annotation on CREATE and keeps a
    # supplied one. Objects with a controller ownerReference are skipped, since
    # their creator is a controller, not the submitter. It never rejects a
    # request: on a policy or CEL error the request is admitted unchanged.
    # Requires MutatingAdmissionPolicy: v1 on Kubernetes 1.36+, or the v1beta1
    # API enabled on 1.34-1.35.
    enabled: false
    # Annotation key that receives the caller's username.
    annotation: karta.run.ai/submitted-by
    # MutatingAdmissionPolicy API version: v1 or v1beta1. Empty detects it from
    # the cluster. Set it for helm template and GitOps tools, which cannot detect it.
    apiVersion: ""
    # Workload types, by API group, version and plural resource name. The chart
    # sets operations and scope. Required when enabled is true.
    # Example:
    # - apiGroups: ["batch"]
    #   apiVersions: ["v1"]
    #   resources: ["jobs"]
    resources: []
    # Types to skip during capture, in the same form. Exclusions win.
    excludeResources: []
    # Capture in namespaces matching these labels. Helm merges maps with these
    # defaults, so to match all namespaces set matchLabels: null rather than {}.
    namespaceSelector:
      matchLabels:
        karta.run.ai/capture-submitter: "true"
    # Capture objects matching these labels. {} matches all objects.
    objectSelector: {}
    # Extra CEL conditions on the CREATE request; all must pass for capture.
    # An expression that fails to evaluate skips capture. Names starting with
    # karta- are reserved.
    matchConditions: []

logLevel: info

# Extra flags appended after the chart's default args. Use this to add flags
# without replacing the defaults entirely.
extraArgs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# A pre-install/pre-upgrade Job server-side-applies the bundled CRD, so
# `helm upgrade` rolls the schema forward (Helm never upgrades crds/ itself).
crdUpgrader:
  enabled: true
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.34.0
    pullPolicy: IfNotPresent
  backoffLimit: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 2Gi
