# Default values for the karta operator chart.
# Override with --set key=value or -f my-values.yaml.

global:
  # Go FIPS 140-3 runtime mode: off, on, or only. See docs/FIPS.md.
  fipsMode: "off"

# Set false to skip the operator workload.
operator:
  enabled: true

# Process scaffold only; no metrics endpoint is implemented yet.
exporter:
  enabled: false
  image:
    repository: ghcr.io/dsx-ai-factory/workload-map/karta-metrics-exporter
    # When empty, falls back to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Extra labels for Pod info and workload status. Expressions read object.
  # See karta-metrics-exporter/pkg/labelevaluator/README.md.
  labelRules: []
  # Shared generic label evaluation limits. Zero selects the default.
  genericLabelEvaluationLimits:
    costLimit: 10000
    maxExpressionBytes: 4096
    maxResultBytes: 1024
  # Rendered verbatim into the exporter's config file (ConfigMap). Selects a
  # definition when its name is in include. Empty selects all; exclude wins.
  kartaDefinitionSource:
    # Definitions built into the exporter, named as in docs/catalog, for
    # example batch-job-v1. Unknown names fail startup.
    catalog:
      enabled: false
      include: []
      exclude: []
    # Karta objects in the cluster, named by metadata.name. A cluster one
    # replaces the built-in catalog definition for the same group and kind;
    # an excluded one does not, so exclude a kind in both sources to drop it.
    # Grants read access to Kartas.
    cluster:
      enabled: true
      include: []
      exclude: []

# Overrides for resource names. Rarely needed.
fullnameOverride: ""

# Keep at 1 unless leaderElection.enabled is true; without leader election
# multiple replicas would reconcile concurrently.
replicaCount: 1

# When enabled, only the replica holding the lease reconciles (active/passive).
# The chart also creates a namespaced Role/RoleBinding for the lease object.
leaderElection:
  enabled: false
  id: karta-operator.run.ai

image:
  repository: ghcr.io/dsx-ai-factory/workload-map/karta-operator
  # When empty, falls back to .Chart.AppVersion so chart and image versions
  # stay in lockstep.
  tag: ""
  pullPolicy: IfNotPresent

# Image pull secrets for private registries.
imagePullSecrets: []

# Pod annotations (e.g. Prometheus scrape hints).
podAnnotations: {}

serviceAccount:
  # Set false to use an externally managed ServiceAccount (set name below).
  create: true
  # Only used when create: false — name of the externally managed SA.
  name: ""

ports:
  metrics: 8080
  health: 8081

webhook:
  enabled: true
  port: 9443
  cert:
    # auto: the operator self-signs and rotates the serving cert (no cert-manager).
    # manual: certs are supplied externally (cert-manager, an admin, ...); the
    #   operator only reads the mounted Secret and never touches the cert.
    provisionMode: auto
    # manual mode only: a static CA bundle to stamp on the webhook configs.
    caBundle: ""
    # manual mode only: annotations for the webhook configs. Wire cert-manager
    # here, e.g. cert-manager.io/inject-ca-from: <namespace>/<certificate-name>
    annotations: {}

# Native admission policies, run by the API server. They need neither the
# operator nor the exporter, so operator.enabled does not affect them.
admissionPolicies:
  # Records the authenticated caller that creates a workload in an annotation,
  # best effort.
  submitter:
    # A MutatingAdmissionPolicy fills a missing annotation on CREATE and keeps a
    # supplied one. Objects with a controller ownerReference are skipped, since
    # their creator is a controller, not the submitter. It never rejects a
    # request: on a policy or CEL error the request is admitted unchanged.
    # Requires MutatingAdmissionPolicy: v1 on Kubernetes 1.36+, or the v1beta1
    # API enabled on 1.34-1.35.
    enabled: false
    # Annotation key that receives the caller's username.
    annotation: karta.run.ai/submitted-by
    # MutatingAdmissionPolicy API version: v1 or v1beta1. Empty detects it from
    # the cluster. Set it for helm template and GitOps tools, which cannot detect it.
    apiVersion: ""
    # Workload types, by API group, version and plural resource name. The chart
    # sets operations and scope. Required when enabled is true.
    # Example:
    # - apiGroups: ["batch"]
    #   apiVersions: ["v1"]
    #   resources: ["jobs"]
    resources: []
    # Types to skip during capture, in the same form. Exclusions win.
    excludeResources: []
    # Capture in namespaces matching these labels. Helm merges maps with these
    # defaults, so to match all namespaces set matchLabels: null rather than {}.
    namespaceSelector:
      matchLabels:
        karta.run.ai/capture-submitter: "true"
    # Capture objects matching these labels. {} matches all objects.
    objectSelector: {}
    # Extra CEL conditions on the CREATE request; all must pass for capture.
    # An expression that fails to evaluate skips capture. Names starting with
    # karta- are reserved.
    matchConditions: []

logLevel: info

# Extra flags appended after the chart's default args. Use this to add flags
# without replacing the defaults entirely.
extraArgs: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# A pre-install/pre-upgrade Job server-side-applies the bundled CRD, so
# `helm upgrade` rolls the schema forward (Helm never upgrades crds/ itself).
crdUpgrader:
  enabled: true
  image:
    repository: registry.k8s.io/kubectl
    tag: v1.34.0
    pullPolicy: IfNotPresent
  backoffLimit: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 2Gi
