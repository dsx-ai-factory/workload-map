apiVersion: apps/v1
kind: Deployment
metadata:
  name: embed-svc
  namespace: ml-team
spec:
  replicas: 3
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: server
          resources:
            limits:
              nvidia.com/gpu: "2"
              cpu: 200m
              memory: 2Gi
