<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Workload Map architecture layers</title>
  <desc>Three layers. Consumers on top: the kli CLI, the Headlamp plugin, which runs the engine as WebAssembly, the operator, which validates definitions, and your own scheduler or controller. In the middle, the Go library evaluates paths, extracts status and pods, and builds the workload tree. At the bottom, definitions come from the built-in catalog or from Karta resources stored in the cluster, which override the catalog.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <g>
    <rect x="0" y="0" width="960" height="560" rx="12" fill="#f6f8fa"/>
    <rect x="0.5" y="0.5" width="959" height="559" rx="12" fill="none" stroke="#d0d7de"/>
    <rect x="30" y="28" width="900" height="150" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#d0d7de"/>
    <text x="48" y="52" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#57606a">CONSUMERS</text>
    <rect x="60.0" y="66" width="198" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="159.0" y="107.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">kli CLI</text>
    <text x="159.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#57606a">Inspects workloads</text>
    <rect x="274.0" y="66" width="198" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="373.0" y="107.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Headlamp plugin</text>
    <text x="373.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#57606a">Runs in the browser</text>
    <rect x="488.0" y="66" width="198" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="587.0" y="107.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Operator</text>
    <text x="587.0" y="127.0" text-anchor="middle" font-size="12.5" fill="#57606a">Validates definitions</text>
    <rect x="702.0" y="66" width="198" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="801.0" y="107.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Your scheduler</text>
    <text x="801.0" y="127.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">or controller</text>
    <path d="M 159.0 178 L 159.0 214" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 373.0 178 L 373.0 214" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 587.0 178 L 587.0 214" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 801.0 178 L 801.0 214" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="30" y="214" width="900" height="130" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#d0d7de"/>
    <text x="48" y="238" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#57606a">GO LIBRARY</text>
    <rect x="60" y="248" width="840" height="76" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="480.0" y="281.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">karta/sdk</text>
    <text x="480.0" y="303.0" text-anchor="middle" font-size="12.5" fill="#57606a">Evaluate paths, extract status and pods, build the workload tree</text>
    <path d="M 480 344 L 480 380" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="30" y="380" width="900" height="150" rx="12" fill="#ffffff" fill-opacity="0.55" stroke="#d0d7de"/>
    <text x="48" y="404" font-size="11.5" font-weight="700" letter-spacing="0.8" fill="#57606a">DEFINITIONS</text>
    <rect x="60" y="414" width="410" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="265.0" y="455.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Built-in catalog</text>
    <text x="265.0" y="475.0" text-anchor="middle" font-size="12.5" fill="#57606a">Embedded in the library and the CLI</text>
    <rect x="490" y="414" width="410" height="92" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="695.0" y="455.0" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Karta resources</text>
    <text x="695.0" y="475.0" text-anchor="middle" font-size="12.5" fill="#57606a">Stored in the cluster, override the catalog</text>
  </g>
</svg>
