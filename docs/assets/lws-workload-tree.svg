<svg viewBox="0 0 1160 470" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Workload tree derived from a LeaderWorkerSet via its Karta definition</title>
  <desc>A LeaderWorkerSet named demo, status Running, with two gang-scheduled groups. Each group has a leader pod and a worker pod, 8 GPUs per pod, resolved down to nodes.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#eceff3" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1160" height="470" rx="12" fill="#f6f8fa"/>
  <rect x="0" y="0" width="1160" height="470" rx="12" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1159" height="469" rx="12" fill="none" stroke="#d0d7de"/>

  <!-- connectors -->
  <g fill="none" stroke="#b6c2cd" stroke-width="1.5">
    <path d="M 580 128 L 580 152 L 345 152 L 345 186"/>
    <path d="M 580 128 L 580 152 L 815 152 L 815 186"/>
    <path d="M 345 282 L 345 308 L 258 308 L 258 336"/>
    <path d="M 345 282 L 345 308 L 433 308 L 433 336"/>
    <path d="M 815 282 L 815 308 L 728 308 L 728 336"/>
    <path d="M 815 282 L 815 308 L 903 308 L 903 336"/>
  </g>

  <!-- root card: LeaderWorkerSet/demo -->
  <g>
    <rect x="410" y="40" width="340" height="88" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="428" y="56" width="30" height="30" rx="7" fill="#326ce5"/>
    <text x="443" y="76" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">LWS</text>
    <text x="470" y="70" font-size="15" font-weight="700" fill="#1f2328">demo</text>
    <text x="470" y="88" font-size="12" fill="#57606a">LeaderWorkerSet &#183; x-k8s.io/v1</text>
    <rect x="666" y="54" width="68" height="22" rx="11" fill="#dafbe1"/>
    <text x="700" y="69" text-anchor="middle" font-size="12" font-weight="600" fill="#116329">Running</text>
    <text x="428" y="112" font-size="12" fill="#57606a">4 pods &#183; 32 GPUs requested &#183; gang scheduled per group</text>
  </g>

  <!-- group card: group[0] -->
  <g>
    <rect x="180" y="186" width="330" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="180" y="186" width="4" height="96" rx="2" fill="#0969da"/>
    <text x="202" y="214" font-size="14" font-weight="700" fill="#1f2328">group[0]</text>
    <rect x="278" y="200" width="30" height="20" rx="10" fill="#ddf4ff"/>
    <text x="293" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">x2</text>
    <text x="202" y="240" font-size="12.5" fill="#57606a">2/2 ready &#183; 8 GPUs per pod &#183; 16 total</text>
    <text x="202" y="262" font-size="12.5" fill="#57606a">leader + worker &#183; one gang</text>
  </g>

  <!-- group card: group[1] -->
  <g>
    <rect x="650" y="186" width="330" height="96" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <rect x="650" y="186" width="4" height="96" rx="2" fill="#0969da"/>
    <text x="672" y="214" font-size="14" font-weight="700" fill="#1f2328">group[1]</text>
    <rect x="748" y="200" width="30" height="20" rx="10" fill="#ddf4ff"/>
    <text x="763" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0969da">x2</text>
    <text x="672" y="240" font-size="12.5" fill="#57606a">2/2 ready &#183; 8 GPUs per pod &#183; 16 total</text>
    <text x="672" y="262" font-size="12.5" fill="#57606a">leader + worker &#183; one gang</text>
  </g>

  <!-- pod card: group 0 leader -->
  <g>
    <rect x="175" y="336" width="166" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="191" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-0</text>
    <circle cx="197" cy="376" r="4" fill="#1a7f37"/>
    <text x="207" y="380" font-size="11.5" fill="#57606a">Running &#183; leader</text>
    <text x="191" y="398" font-size="11.5" fill="#57606a">node-01 &#183; 8 GPUs</text>
  </g>

  <!-- pod card: group 0 worker -->
  <g>
    <rect x="350" y="336" width="166" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="366" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-0-1</text>
    <circle cx="372" cy="376" r="4" fill="#1a7f37"/>
    <text x="382" y="380" font-size="11.5" fill="#57606a">Running &#183; worker</text>
    <text x="366" y="398" font-size="11.5" fill="#57606a">node-02 &#183; 8 GPUs</text>
  </g>

  <!-- pod card: group 1 leader -->
  <g>
    <rect x="645" y="336" width="166" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="661" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-1</text>
    <circle cx="667" cy="376" r="4" fill="#1a7f37"/>
    <text x="677" y="380" font-size="11.5" fill="#57606a">Running &#183; leader</text>
    <text x="661" y="398" font-size="11.5" fill="#57606a">node-03 &#183; 8 GPUs</text>
  </g>

  <!-- pod card: group 1 worker -->
  <g>
    <rect x="820" y="336" width="166" height="70" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <text x="836" y="360" font-size="12.5" font-weight="600" fill="#1f2328">demo-1-1</text>
    <circle cx="842" cy="376" r="4" fill="#1a7f37"/>
    <text x="852" y="380" font-size="11.5" fill="#57606a">Running &#183; worker</text>
    <text x="836" y="398" font-size="11.5" fill="#57606a">node-04 &#183; 8 GPUs</text>
  </g>

  <!-- footer -->
  <text x="24" y="446" font-size="11.5" fill="#8b949e">Derived from docs/catalog/leaderworkerset-x-k8s-io-leaderworkerset-v1.yaml &#183; no LeaderWorkerSet-specific code</text>
</svg>
