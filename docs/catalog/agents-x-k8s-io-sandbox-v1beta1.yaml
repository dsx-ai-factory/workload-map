kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: agents-x-k8s-io-sandbox-v1beta1
spec:
  structureDefinition:
    rootComponent:
      name: sandbox
      kind:
        group: agents.x-k8s.io
        version: v1beta1
        kind: Sandbox
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byConditions:
                - type: Ready
                  status: "False"
                - type: Suspended
                  status: "False"
              byExpression:
                expression: (.spec.operatingMode // "Running") != "Suspended"
                expectedResult: "true"
          running:
            - byConditions:
                - type: Ready
                  status: "True"
              byExpression:
                expression: (.spec.operatingMode // "Running") != "Suspended"
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
              byExpression:
                expression: .spec.operatingMode == "Suspended"
                expectedResult: "true"
          suspending:
            - byExpression:
                expression: .spec.operatingMode == "Suspended" and ([(.status.conditions // [])[] | select(.type == "Suspended" and .status == "True")] | length) == 0
                expectedResult: "true"
          resuming:
            - byConditions:
                - type: Suspended
                  status: "True"
              byExpression:
                expression: (.spec.operatingMode // "Running") != "Suspended"
                expectedResult: "true"
      suspendDefinition:
        suspendActions:
          - path: .spec.operatingMode
            value: '"Suspended"'
        resumeActions:
          - path: .spec.operatingMode
            value: '"Running"'
    childComponents:
      - name: agent
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: sandbox
        specDefinition:
          podTemplateSpecPath: .spec.podTemplate
        scaleDefinition:
          replicasPath: if .spec.operatingMode == "Suspended" then 0 else 1 end
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["agents.x-k8s.io/sandbox-name-hash"]
      - name: companion
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: sandbox
        podSelector:
          componentTypeSelector:
            keyPath: select(.metadata.labels["agents.x-k8s.io/sandbox-name-hash"] == null) | [.metadata.ownerReferences[]? | select(.kind == "Sandbox") | .uid][0]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: sandbox
          members:
            - componentName: agent
              groupByKeyPaths:
                - '[.metadata.ownerReferences[]? | select(.kind == "Sandbox") | .uid][0]'
            - componentName: companion
              groupByKeyPaths:
                - '[.metadata.ownerReferences[]? | select(.kind == "Sandbox") | .uid][0]'
