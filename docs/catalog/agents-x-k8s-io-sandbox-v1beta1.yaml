kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: agents-x-k8s-io-sandbox-v1beta1
spec:
  structureDefinition:
    rootComponent:
      name: sandbox
      kind:
        group: agents.x-k8s.io
        version: v1beta1
        kind: Sandbox
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: DependenciesNotReady
                - type: Suspended
                  status: "False"
              byExpression:
                expression: (.metadata.generation // 0) as $generation | (.spec.operatingMode // "Running") != "Suspended" and (any(.status.conditions[]?; .type == "Finished" and .status == "True") | not) and (.status.observedGeneration == null or .status.observedGeneration >= $generation) and all(.status.conditions[]? | select(.type | IN("Ready", "Suspended")); .observedGeneration == null or .observedGeneration >= $generation)
                expectedResult: "true"
          progressing:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: DependenciesNotReady
                - type: Suspended
                  status: "False"
                - type: PodScheduled
                  status: "True"
              byExpression:
                expression: (.metadata.generation // 0) as $generation | (.spec.operatingMode // "Running") != "Suspended" and (any(.status.conditions[]?; .type == "Finished" and .status == "True") | not) and (.status.observedGeneration == null or .status.observedGeneration >= $generation) and all(.status.conditions[]? | select(.type | IN("Ready", "Suspended", "PodScheduled")); .observedGeneration == null or .observedGeneration >= $generation)
                expectedResult: "true"
          running:
            - byConditions:
                - type: Ready
                  status: "True"
              byExpression:
                expression: (.spec.operatingMode // "Running") != "Suspended" and ([(.status.conditions // [])[] | select(.type == "Suspended" and .status == "True")] | length) == 0
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
              byExpression:
                expression: .spec.operatingMode == "Suspended"
                expectedResult: "true"
          suspending:
            - byExpression:
                expression: .spec.operatingMode == "Suspended" and ([(.status.conditions // [])[] | select(.type == "Suspended" and .status == "True")] | length) == 0
                expectedResult: "true"
          resuming:
            - byConditions:
                - type: Suspended
                  status: "True"
              byExpression:
                expression: (.spec.operatingMode // "Running") != "Suspended"
                expectedResult: "true"
      suspendDefinition:
        suspendActions:
          - path: .spec.operatingMode
            value: '"Suspended"'
        resumeActions:
          - path: .spec.operatingMode
            value: '"Running"'
    childComponents:
      - name: agent
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: sandbox
        specDefinition:
          podTemplateSpecPath: .spec.podTemplate
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["agents.x-k8s.io/sandbox-name-hash"]
      - name: companion
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: sandbox
        podSelector:
          componentTypeSelector:
            keyPath: select(.metadata.labels["agents.x-k8s.io/sandbox-name-hash"] == null) | [.metadata.ownerReferences[]? | select(.kind == "Sandbox" and (.apiVersion | startswith("agents.x-k8s.io/"))) | .uid][0]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: sandbox
          members:
            - componentName: agent
              groupByKeyPaths:
                - '[.metadata.ownerReferences[]? | select(.kind == "Sandbox" and (.apiVersion | startswith("agents.x-k8s.io/"))) | .uid][0]'
            - componentName: companion
              groupByKeyPaths:
                - '[.metadata.ownerReferences[]? | select(.kind == "Sandbox" and (.apiVersion | startswith("agents.x-k8s.io/"))) | .uid][0]'
