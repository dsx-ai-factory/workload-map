kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: apps-nvidia-com-nimcache-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: nimcache
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMCache
      specDefinition:
        fragmentedPodSpecDefinition:
          resourcesPath: '{requests: .spec.resources}'
      scaleDefinition:
        replicasPath: "1"
      statusDefinition:
        phaseDefinition:
          path: .status.state
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and
                      (.metadata.generation // 0) > 0 and (.status == null or .status == {})
                expectedResult: "true"
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and (.status.state | IN("Pending", "PVC-Created", "Started")) and (any(.status.conditions[]?; .type == "NIM_CACHE_JOB_COMPLETED" and .status == "True") | not)
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and (.status.state | IN("Pending", "PVC-Created", "Started")) and (any(.status.conditions[]?; .type == "NIM_CACHE_JOB_COMPLETED" and .status == "True") | not) and ((.status.state | IN("PVC-Created", "Started")) or any(.status.conditions[]?; .type == "NIM_CACHE_JOB_CREATED" and .status == "True"))
                expectedResult: "true"
          running:
            - byPhase: InProgress
          completed:
            - byPhase: Ready
              byConditions:
                - type: NIM_CACHE_JOB_COMPLETED
                  status: "True"
          failed:
            - byPhase: Failed
  optimizationInstructions: {}
