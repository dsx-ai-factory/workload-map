kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: apps-nvidia-com-nimservice-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: nimservice
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMService
      specDefinition:
        fragmentedPodSpecDefinition:
          schedulerNamePath: .spec.schedulerName
          labelsPath: .spec.labels
          annotationsPath: .spec.annotations
          resourcesPath: .spec.resources
          podAffinityPath: .spec.affinity.podAffinity
          nodeAffinityPath: .spec.affinity.nodeAffinity
      scaleDefinition:
        replicasPath: .spec.replicas // 1
      statusDefinition:
        phaseDefinition:
          path: .status.state
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and
                      (.metadata.generation // 0) > 0 and (.status == null or .status == {}) and (.spec.replicas // 1) > 0
                expectedResult: "true"
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and (.spec.replicas // 1) > 0 and (.status.state | IN("Pending", "NotReady", "PVC-Created"))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and (.spec.replicas // 1) > 0 and .status.state == "PVC-Created"
                expectedResult: "true"
          running:
            - byPhase: Ready
          failed:
            - byPhase: Failed
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: nimservice
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
