kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: batch-job-v1
spec:
  structureDefinition:
    rootComponent:
      name: job
      kind:
        group: batch
        version: v1
        kind: Job
      specDefinition:
        podTemplateSpecPath: .spec.template
      scaleDefinition:
        replicasPath: .spec.parallelism // 1
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (.spec.parallelism // 1) > 0
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Complete" or .type == "SuccessCriteriaMet" or .type == "Failed"
                              or .type == "FailureTarget" or .type == "Suspended")) | not) and (
                      (.status.ready != null and .status.ready < (if .spec.completions != null then
                      [(.spec.parallelism // 1), ([0, (.spec.completions - (.status.succeeded // 0))] | max)] | min
                      elif (.status.succeeded // 0) > 0 then (.status.active // 0)
                      else (.spec.parallelism // 1) end)) or
                      ((.metadata.generation // 0) > 0 and (.status == null or .status == {}) and (if .spec.completions != null then
                      [(.spec.parallelism // 1), ([0, (.spec.completions - (.status.succeeded // 0))] | max)] | min
                      elif (.status.succeeded // 0) > 0 then (.status.active // 0)
                      else (.spec.parallelism // 1) end) > 0))
                expectedResult: "true"
          running:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (.spec.parallelism // 1) > 0
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Complete" or .type == "SuccessCriteriaMet" or .type == "Failed"
                              or .type == "FailureTarget" or .type == "Suspended")) | not) and (.status.active // 0) > 0 and (.status.ready // 0) > 0
                expectedResult: "true"
          completed:
            - byConditions:
                - type: Complete
                  status: "True"
            - byConditions:
                - type: SuccessCriteriaMet
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
            - byConditions:
                - type: FailureTarget
                  status: "True"
          degraded:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (.spec.parallelism // 1) > 0
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Complete" or .type == "SuccessCriteriaMet" or .type == "Failed"
                              or .type == "FailureTarget" or .type == "Suspended")) | not) and (.status.active // 0) > 0
                      and (.status.ready // 0) > 0
                      and ((.status.failed // 0) > 0 or ((.status.uncountedTerminatedPods.failed // []) | length) > 0)
                      and .status.ready < (if .spec.completions != null then
                      [(.spec.parallelism // 1), ([0, (.spec.completions - (.status.succeeded // 0))] | max)] | min
                      elif (.status.succeeded // 0) > 0 then (.status.active // 0)
                      else (.spec.parallelism // 1) end)
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: job
              groupByKeyPaths:
                - .metadata.labels["batch.kubernetes.io/job-name"]
