kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: core-pod-v1
spec:
  structureDefinition:
    rootComponent:
      name: pod
      kind:
        group: ""
        version: v1
        kind: Pod
      specDefinition:
        podTemplateSpecPath: .
      scaleDefinition:
        replicasPath: "1"
      statusDefinition:
        phaseDefinition:
          path: .status.phase
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byPhase: Pending
          progressing:
            - byPhase: Pending
              byConditions:
                - type: PodScheduled
                  status: "True"
              byExpression:
                expression: .metadata.deletionTimestamp == null
                expectedResult: "true"
          running:
            - byPhase: Running
          completed:
            - byPhase: Succeeded
          failed:
            - byPhase: Failed
  optimizationInstructions: {}
