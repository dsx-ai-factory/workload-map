kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: grove-io-podcliqueset-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: podcliqueset
      kind:
        group: grove.io
        version: v1alpha1
        kind: PodCliqueSet
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.spec.replicas // 0) > 0
                      and (any(.status.conditions[]?; .type == "TopologyLevelsUnavailable" and .status == "True") | not)
                      and (((.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation)
                          and (.status.availableReplicas != null or .status.observedGeneration != null)
                          and (.status.availableReplicas // 0) < .spec.replicas)
                          or ((.metadata.generation // 0) > 0 and ((.status.lastErrors // []) | length == 0)
                              and ((.status == null or .status == {}) or
                                  (.status.observedGeneration != null and .status.observedGeneration < .metadata.generation))))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.spec.updateStrategy.type // "RollingRecreate") != "OnDelete"
                      and .status.updateProgress.updateEndedAt == null
                      and (any(.status.conditions[]?; .type == "TopologyLevelsUnavailable" and .status == "True") | not)
                      and ((.status.updateProgress.updateStartedAt != null and .status.updateProgress.updateStartedAt != ""
                          and .status.updateProgress.updateStartedAt != "0001-01-01T00:00:00Z")
                          or any(.status.conditions[]?; .type == "UpdateInProgress" and (.status == "True" or (.status == "Unknown" and .reason == "ProgressDeadlineExceeded"))))
                expectedResult: "true"
          running:
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and .status != null and (.status.availableReplicas // 0) >= (.spec.replicas // 0)
                expectedResult: "true"
          failed:
            - byConditions:
                - type: TopologyLevelsUnavailable
                  status: "True"
    childComponents:
      - name: clique
        kind:
          group: grove.io
          version: v1alpha1
          kind: PodClique
        ownerRef: podcliqueset
        specDefinition:
          fragmentedPodSpecDefinition:
            schedulerNamePath: .spec.template.cliques[].spec.podSpec.schedulerName
            labelsPath: .spec.template.cliques[].labels
            annotationsPath: .spec.template.cliques[].annotations
            resourceClaimsPath: .spec.template.cliques[].spec.podSpec.resourceClaims
            podAffinityPath: .spec.template.cliques[].spec.podSpec.affinity.podAffinity
            nodeAffinityPath: .spec.template.cliques[].spec.podSpec.affinity.nodeAffinity
            containersPath: .spec.template.cliques[].spec.podSpec.containers
            priorityClassNamePath: .spec.template.cliques[].spec.podSpec.priorityClassName
        scaleDefinition:
          replicasPath: (.spec.replicas // 1) * (.spec.template.cliques[].spec.replicas // 1)
          minReplicasPath: .spec.template.cliques[].spec.autoScalingConfig.minReplicas
          maxReplicasPath: .spec.template.cliques[].spec.autoScalingConfig.maxReplicas
        instanceIdPath: .spec.template.cliques[].name
        podSelector:
          componentInstanceSelector:
            idPath: .metadata.labels["grove.io/podclique"]
          replicaSelector:
            keyPath: .metadata.labels["grove.io/podcliqueset-replica-index"]
      - name: scalinggroup
        kind:
          group: grove.io
          version: v1alpha1
          kind: PodCliqueScalingGroup
        ownerRef: podcliqueset
        scaleDefinition:
          replicasPath: (.spec.replicas // 1) * (.spec.template.podCliqueScalingGroups[].replicas // 1)
          minReplicasPath: .spec.template.podCliqueScalingGroups[].scaleConfig.minReplicas
          maxReplicasPath: .spec.template.podCliqueScalingGroups[].scaleConfig.maxReplicas
        instanceIdPath: .spec.template.podCliqueScalingGroups[].name
        podSelector:
          componentInstanceSelector:
            idPath: .metadata.labels["grove.io/podcliquescalinggroup"]
          replicaSelector:
            keyPath: .metadata.labels["grove.io/podcliquescalinggroup-replica-index"]
    additionalChildKinds:
      - group: grove.io
        version: v1alpha1
        kind: PodClique
      - group: grove.io
        version: v1alpha1
        kind: PodCliqueScalingGroup
      - group: scheduler.grove.io
        version: v1alpha1
        kind: PodGang
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: podcliqueset-replica
          members:
            - componentName: clique
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/part-of"]
                - .metadata.labels["grove.io/podcliqueset-replica-index"]
            - componentName: scalinggroup
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/part-of"]
                - .metadata.labels["grove.io/podcliqueset-replica-index"]
