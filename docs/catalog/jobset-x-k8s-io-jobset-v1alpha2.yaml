kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: jobset-x-k8s-io-jobset-v1alpha2
spec:
  structureDefinition:
    rootComponent:
      name: jobset
      kind:
        group: jobset.x-k8s.io
        version: v1alpha2
        kind: JobSet
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Completed" or .type == "Failed")) | not) and (
                      . as $jobset | any(.spec.replicatedJobs[]?; . as $desired |
                          ($jobset.status.replicatedJobsStatus // [] | map(select(.name == $desired.name)) | .[0]) as $observed |
                          ($desired.replicas // 1) > 0 and (
                              ($observed != null and ($desired.replicas // 1) >
                                  (([$observed.ready // 0, $observed.active // 0] | min) + ($observed.succeeded // 0))) or
                              ($observed == null and ($jobset.metadata.generation // 0) > 0))))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Completed" or .type == "Failed")) | not) and (
                      any(.status.conditions[]?; .type == "RestartingJobSet" and .status == "True")
                      or (.spec.startupPolicy.startupPolicyOrder == "InOrder"
                          and any(.status.conditions[]?; .type == "StartupPolicyInProgress" and .status == "True")))
                expectedResult: "true"
          running:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true
                      and (any(.status.conditions[]?; .status == "True"
                          and (.type == "Completed" or .type == "Failed")) | not) and ((.status.replicatedJobsStatus // []) |
                      any((.ready // 0) > 0 and (.active // 0) > 0) and all((.failed // 0) == 0))
                expectedResult: "true"
          completed:
            - byConditions:
                - type: Completed
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
              byExpression:
                expression: .spec.suspend == true
                expectedResult: "true"
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
    childComponents:
      - name: replicatedjob
        kind:
          group: batch
          version: v1
          kind: Job
        ownerRef: jobset
        specDefinition:
          podTemplateSpecPath: .spec.replicatedJobs[].template.spec.template
        scaleDefinition:
          replicasPath: .spec.replicatedJobs[] | .replicas * .template.spec.parallelism
        instanceIdPath: .spec.replicatedJobs[].name
        podSelector:
          componentInstanceSelector:
            idPath: .metadata.labels["jobset.sigs.k8s.io/replicatedjob-name"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: replicatedjob
              groupByKeyPaths:
                - .metadata.labels["jobset.sigs.k8s.io/replicatedjob-name"]
