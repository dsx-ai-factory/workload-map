kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: kubeflow-org-mpijob-v2beta1
spec:
  structureDefinition:
    rootComponent:
      name: mpijob
      kind:
        group: kubeflow.org
        version: v2beta1
        kind: MPIJob
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byConditions:
                - type: Created
                  status: "True"
              byExpression:
                expression: |-
                  .spec.runPolicy.suspend != true and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Running" or .type == "Succeeded" or .type == "Failed" or .type == "Suspended")) | not)
                expectedResult: "true"
          progressing:
            - byConditions:
                - type: Created
                  status: "True"
              byExpression:
                expression: |-
                  .spec.runPolicy.suspend != true and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Running" or .type == "Succeeded" or .type == "Failed" or .type == "Suspended")) | not) and
                                                          any(.status.replicaStatuses[]?; (.active // 0) > 0)
                expectedResult: "true"
          running:
            - byConditions:
                - type: Running
                  status: "True"
          completed:
            - byConditions:
                - type: Succeeded
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
          degraded:
            - byConditions:
                - type: Running
                  status: "True"
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.runPolicy.suspend != true and
                                                          .spec.runPolicy.backoffLimit == 0 and (.status.replicaStatuses.Launcher.failed // 0) > 0 and
                                                          any(.status.replicaStatuses[]?; (.active // 0) > 0) and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Succeeded" or .type == "Failed" or .type == "Suspended")) | not)
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      suspendDefinition:
        suspendActions:
          - path: .spec.runPolicy.suspend
            value: "true"
        resumeActions:
          - path: .spec.runPolicy.suspend
            value: "false"
    childComponents:
      - name: launcher
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpecPath: .spec.mpiReplicaSpecs.Launcher.template
        scaleDefinition:
          replicasPath: .spec.mpiReplicaSpecs.Launcher.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/job-role"]
            value: launcher
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: mpijob
        specDefinition:
          podTemplateSpecPath: .spec.mpiReplicaSpecs.Worker.template
        scaleDefinition:
          replicasPath: .spec.mpiReplicaSpecs.Worker.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/job-role"]
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: launcher
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
