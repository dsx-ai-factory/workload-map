kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: kubeflow-org-pytorchjob-v1
spec:
  structureDefinition:
    rootComponent:
      name: pytorchjob
      kind:
        group: kubeflow.org
        version: v1
        kind: PyTorchJob
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byConditions:
                - type: Created
                  status: "True"
              byExpression:
                expression: |-
                  .spec.runPolicy.suspend != true and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Running" or .type == "Succeeded" or .type == "Failed" or .type == "Suspended")) | not)
                expectedResult: "true"
            - byConditions:
                - type: Running
                  status: "True"
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.runPolicy.suspend != true and
                                                          .spec.elasticPolicy == null and .spec.pytorchReplicaSpecs.Worker != null and
                                                          .status.replicaStatuses.Worker != null and
                                                          (.status.replicaStatuses.Master.active // 0) > 0 and
                                                          (.status.replicaStatuses.Worker.failed // 0) == 0 and
                                                          ((.status.replicaStatuses.Worker.active // 0) + (.status.replicaStatuses.Worker.succeeded // 0)) <
                                                              (.spec.pytorchReplicaSpecs.Worker.replicas // 1) and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Succeeded" or .type == "Failed" or .type == "Suspended" or .type == "Restarting")) | not)
                expectedResult: "true"
          progressing:
            - byConditions:
                - type: Created
                  status: "True"
              byExpression:
                expression: |-
                  .spec.runPolicy.suspend != true and
                                                          (any(.status.conditions[]?; .status == "True" and
                                                              (.type == "Running" or .type == "Succeeded" or .type == "Failed" or .type == "Suspended")) | not) and
                                                          any(.status.replicaStatuses[]?; (.active // 0) > 0)
                expectedResult: "true"
          running:
            - byConditions:
                - type: Running
                  status: "True"
          completed:
            - byConditions:
                - type: Succeeded
                  status: "True"
          failed:
            - byConditions:
                - type: Failed
                  status: "True"
          suspended:
            - byConditions:
                - type: Suspended
                  status: "True"
      suspendDefinition:
        suspendActions:
          - path: .spec.runPolicy.suspend
            value: "true"
        resumeActions:
          - path: .spec.runPolicy.suspend
            value: "false"
    childComponents:
      - name: master
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpecPath: .spec.pytorchReplicaSpecs.Master.template
        scaleDefinition:
          replicasPath: .spec.pytorchReplicaSpecs.Master.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: master
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: pytorchjob
        specDefinition:
          podTemplateSpecPath: .spec.pytorchReplicaSpecs.Worker.template
        scaleDefinition:
          replicasPath: .spec.pytorchReplicaSpecs.Worker.replicas // 1
          minReplicasPath: .spec.elasticPolicy.minReplicas
          maxReplicasPath: .spec.elasticPolicy.maxReplicas
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["training.kubeflow.org/replica-type"]
            value: worker
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: master
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["training.kubeflow.org/job-name"]
