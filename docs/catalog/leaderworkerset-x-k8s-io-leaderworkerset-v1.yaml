kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: leaderworkerset-x-k8s-io-leaderworkerset-v1
spec:
  structureDefinition:
    rootComponent:
      name: leaderworkerset
      kind:
        group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.spec.replicas // 1) > 0
                      and ((any(.status.conditions[]?; .type == "Available" and .status == "False") and
                            any(.status.conditions[]?; .type == "Progressing" and .status == "False") and
                            any(.status.conditions[]?; .type == "UpdateInProgress" and .status == "False")) | not)
                      and ((.metadata.deletionTimestamp == null
                      and (.status.observedGeneration == null or .metadata.generation == null
                          or .status.observedGeneration == .metadata.generation) and (.status.readyReplicas // 0) < (.spec.replicas // 1)
                          and (.status.readyReplicas != null or any(.status.conditions[]?;
                              (.type == "Progressing" or .type == "UpdateInProgress") and .status == "True")))
                          or ((.metadata.generation // 0) > 0 and
                              ((.status == null or .status == {}) or
                               (.status.observedGeneration != null and .status.observedGeneration < .metadata.generation))))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and (.status.observedGeneration == null or .metadata.generation == null
                          or .status.observedGeneration == .metadata.generation) and any(.status.conditions[]?;
                      (.type == "Progressing" or .type == "UpdateInProgress") and .status == "True")
                expectedResult: "true"
          running:
            - byConditions:
                - type: Available
                  status: "True"
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and (.status.observedGeneration == null or .metadata.generation == null
                          or .status.observedGeneration == .metadata.generation) and (.spec.replicas // 1) > 0
                      and (.status.replicas // 0) >= (.spec.replicas // 1)
                      and (.status.readyReplicas // 0) >= (.spec.replicas // 1)
                expectedResult: "true"
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and (.status.observedGeneration == null or .metadata.generation == null
                          or .status.observedGeneration == .metadata.generation) and (.spec.replicas // 1) > 0
                      and (.status.replicas // 0) >= (.spec.replicas // 1)
                      and (.status.readyReplicas // 0) >= (.spec.replicas // 1)
                expectedResult: "true"
          failed:
            - byConditions:
                - type: Available
                  status: "False"
                - type: Progressing
                  status: "False"
                - type: UpdateInProgress
                  status: "False"
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null
                      and (.status.observedGeneration == null or .metadata.generation == null
                          or .status.observedGeneration == .metadata.generation)
                expectedResult: "true"
    childComponents:
      - name: group
        ownerRef: leaderworkerset
        scaleDefinition:
          replicasPath: .spec.leaderWorkerTemplate.size
        podSelector:
          replicaSelector:
            keyPath: .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"]
      - name: leader
        kind:
          group: apps
          version: v1
          kind: StatefulSet
        ownerRef: group
        specDefinition:
          podTemplateSpecPath: .spec.leaderWorkerTemplate.leaderTemplate
        scaleDefinition:
          replicasPath: .spec.replicas // 1
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["leaderworkerset.sigs.k8s.io/worker-index"]
            value: "0"
      - name: worker
        kind:
          group: apps
          version: v1
          kind: StatefulSet
        ownerRef: group
        specDefinition:
          podTemplateSpecPath: .spec.leaderWorkerTemplate.workerTemplate
        scaleDefinition:
          replicasPath: (.spec.replicas // 1) * ((.spec.leaderWorkerTemplate.size // 1) - 1)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.annotations["leaderworkerset.sigs.k8s.io/leader-name"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: group
          members:
            - componentName: group
              groupByKeyPaths:
                - .metadata.labels["leaderworkerset.sigs.k8s.io/name"]
                - .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"] // "0"
