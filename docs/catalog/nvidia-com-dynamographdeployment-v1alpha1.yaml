kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: nvidia-com-dynamographdeployment-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: dynamographdeployment
      kind:
        group: nvidia.com
        version: v1alpha1
        kind: DynamoGraphDeployment
      statusDefinition:
        phaseDefinition:
          path: .status.state
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and ((.status.state == "pending" and
                                                      (.metadata.generation == null or .status.observedGeneration == null or
                                                       .status.observedGeneration >= .metadata.generation)) or
                                                      (.metadata.deletionTimestamp == null and (.metadata.generation // 0) > 0 and
                                                       any(.spec.services[]?; (.replicas // 1) > 0) and
                                                       (((.status == null or ((.status | keys) - ["state"] | length) == 0) and
                                                         (.status.state == null or (.status.state | IN("", "initializing")))) or
                                                        (.status.observedGeneration != null and .status.observedGeneration < .metadata.generation and
                                                         (.status.state | IN("initializing", "pending", "successful"))))))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .status.state != "failed" and
                                                      (.status.rollingUpdate.phase == "Pending" or .status.rollingUpdate.phase == "InProgress") and
                                                      (.metadata.generation == null or .status.observedGeneration == null or
                                                       .status.observedGeneration >= .metadata.generation)
                expectedResult: "true"
          running:
            - byPhase: successful
              byExpression:
                expression: |-
                  (.metadata.generation == null or .status.observedGeneration == null or
                                                      .status.observedGeneration >= .metadata.generation)
                expectedResult: "true"
          failed:
            - byPhase: failed
    childComponents:
      - name: service
        ownerRef: dynamographdeployment
        specDefinition:
          fragmentedPodSpecDefinition:
            schedulerNamePath: .spec.services | .[] | .extraPodSpec.schedulerName
            labelsPath: .spec.services | .[] | .labels
            annotationsPath: .spec.services | .[] | .annotations
            resourcesPath: .spec.services | .[] | .resources
            resourceClaimsPath: .spec.services | .[] | .extraPodSpec.resourceClaims
            podAffinityPath: .spec.services | .[] | .extraPodSpec.affinity.podAffinity
            nodeAffinityPath: .spec.services | .[] | .extraPodSpec.affinity.nodeAffinity
            containerPath: .spec.services | .[] | .extraPodSpec.mainContainer
            priorityClassNamePath: .spec.services | .[] | .extraPodSpec.priorityClassName
            imagePath: .spec.services | .[] | .extraPodSpec.mainContainer.image
        scaleDefinition:
          replicasPath: .spec.services[] | (.replicas // 1) * (.multinode.nodeCount // 1)
          minReplicasPath: .spec.services | .[] | .autoscaling.minReplicas
          maxReplicasPath: .spec.services | .[] | .autoscaling.maxReplicas
        instanceIdPath: .spec.services | to_entries[] | .key
        podSelector:
          componentInstanceSelector:
            idPath: .metadata.labels["nvidia.com/dynamo-component"]
          replicaSelector:
            keyPath: .metadata.labels["grove.io/podcliquescalinggroup-replica-index"] // .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"]
    additionalChildKinds:
      - group: nvidia.com
        version: v1alpha1
        kind: DynamoComponentDeployment
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
      - group: scheduler.grove.io
        version: v1alpha1
        kind: PodGang
      - group: grove.io
        version: v1alpha1
        kind: PodClique
      - group: grove.io
        version: v1alpha1
        kind: PodCliqueSet
      - group: grove.io
        version: v1alpha1
        kind: PodCliqueScalingGroup
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: service
              groupByKeyPaths:
                - .metadata.labels["nvidia.com/dynamo-component"]
