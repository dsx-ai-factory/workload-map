kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: ray-io-raycluster-v1
spec:
  structureDefinition:
    rootComponent:
      name: raycluster
      kind:
        group: ray.io
        version: v1
        kind: RayCluster
      statusDefinition:
        phaseDefinition:
          path: .status.state
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.spec.suspend != true and
                      .status.state != "failed" and
                      (.status.state != "suspended" or
                       (.spec.suspend == false and .metadata.generation != null and
                        .status.observedGeneration == .metadata.generation and
                        any(.status.conditions[]?; .type == "RayClusterSuspending" and .status == "False") and
                        any(.status.conditions[]?; .type == "RayClusterSuspended" and .status == "False"))) and
                      (any(.status.conditions[]?; .status == "True" and
                          (.type == "RayClusterSuspending" or .type == "RayClusterSuspended")) | not) and
                      any(.status.conditions[]?; .type == "RayClusterProvisioned" and .status == "False") and
                      any(.status.conditions[]?; .type == "HeadPodReady" and .status == "False") or
                      ((.metadata.generation // 0) > 0 and
                       ((.status == null or .status == {}) or
                        (.spec.suspend == false and .status.state == "suspended"))))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true and
                      .status.state != "failed" and
                      (.status.state != "suspended" or
                       (.spec.suspend == false and .metadata.generation != null and
                        .status.observedGeneration == .metadata.generation and
                        any(.status.conditions[]?; .type == "RayClusterSuspending" and .status == "False") and
                        any(.status.conditions[]?; .type == "RayClusterSuspended" and .status == "False"))) and
                      (any(.status.conditions[]?; .status == "True" and
                          (.type == "RayClusterSuspending" or .type == "RayClusterSuspended")) | not) and
                      any(.status.conditions[]?; .type == "RayClusterProvisioned" and .status == "False") and
                      any(.status.conditions[]?; .type == "HeadPodReady" and .status == "False") and
                                                      any(.status.conditions[]?; .type == "HeadPodReady" and .status == "False" and
                                                          (.reason == "ContainerCreating" or .reason == "ContainersNotReady" or
                                                           .reason == "ErrImagePull" or .reason == "ImagePullBackOff" or .reason == "CrashLoopBackOff"))
                expectedResult: "true"
          running:
            - byPhase: ready
          failed:
            - byPhase: failed
          suspended:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend == true and
                      .status.state == "suspended" and .metadata.generation != null and
                      .status.observedGeneration == .metadata.generation
                expectedResult: "true"
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: raycluster
        specDefinition:
          podTemplateSpecPath: .spec.headGroupSpec.template
        scaleDefinition:
          replicasPath: "1"
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: raycluster
        specDefinition:
          podTemplateSpecPath: .spec.workerGroupSpecs[].template
        scaleDefinition:
          replicasPath: .spec.workerGroupSpecs[].replicas
          minReplicasPath: .spec.workerGroupSpecs[].minReplicas
          maxReplicasPath: .spec.workerGroupSpecs[].maxReplicas
        instanceIdPath: .spec.workerGroupSpecs[].groupName
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: worker
          componentInstanceSelector:
            idPath: .metadata.labels["ray.io/group"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: cluster
          members:
            - componentName: head
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
