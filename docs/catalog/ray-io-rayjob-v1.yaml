kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: ray-io-rayjob-v1
spec:
  structureDefinition:
    rootComponent:
      name: rayjob
      kind:
        group: ray.io
        version: v1
        kind: RayJob
      statusDefinition:
        phaseDefinition:
          path: .status.jobStatus
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  (.metadata.deletionTimestamp == null and .spec.suspend != true and
                      .status.jobStatus != "RUNNING" and .status.jobStatus != "SUCCEEDED" and
                      .status.jobStatus != "FAILED" and .status.jobStatus != "STOPPED" and
                      (.status.jobDeploymentStatus == null or .status.jobDeploymentStatus == "" or
                       .status.jobDeploymentStatus == "Initializing" or .status.jobDeploymentStatus == "Running" or
                       .status.jobDeploymentStatus == "Waiting") and
                                                      (.status.jobStatus == "PENDING" or .status.jobDeploymentStatus == "Initializing" or
                                                       .status.jobDeploymentStatus == "Waiting" or
                                                       (.status.jobDeploymentStatus == "Running" and
                                                        (.status.jobStatus == null or .status.jobStatus == "")))) or (.metadata.deletionTimestamp == null and (.metadata.generation // 0) > 0 and
                      (.status.jobDeploymentStatus == null or .status.jobDeploymentStatus == "") and
                      (.status.jobStatus == null or .status.jobStatus == "") and
                      (.status.reason == null or .status.reason == "") and
                      (.status.message == null or .status.message == "")) or (.metadata.deletionTimestamp == null and (.metadata.generation // 0) > 0 and
                      .spec.suspend == true and .status.jobDeploymentStatus == "Initializing" and
                      (.status.jobStatus == null or .status.jobStatus == "" or .status.jobStatus == "PENDING") and
                      (.status.reason == null or .status.reason == "") and
                      (.status.message == null or .status.message == ""))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true and
                      .status.jobStatus != "RUNNING" and .status.jobStatus != "SUCCEEDED" and
                      .status.jobStatus != "FAILED" and .status.jobStatus != "STOPPED" and
                      (.status.jobDeploymentStatus == null or .status.jobDeploymentStatus == "" or
                       .status.jobDeploymentStatus == "Initializing" or .status.jobDeploymentStatus == "Running" or
                       .status.jobDeploymentStatus == "Waiting") and .status.jobDeploymentStatus == "Initializing"
                expectedResult: "true"
          running:
            - byPhase: RUNNING
          completed:
            - byPhase: SUCCEEDED
          failed:
            - byPhase: FAILED
          suspended:
            - byExpression:
                expression: .status.jobDeploymentStatus == "Suspended"
                expectedResult: "true"
          suspending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .status.jobDeploymentStatus == "Suspending" and
                                                      (.status.jobStatus | IN("SUCCEEDED", "FAILED", "STOPPED") | not)
                expectedResult: "true"
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayjob
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterSpec.headGroupSpec.template
        scaleDefinition:
          replicasPath: "1"
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayjob
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterSpec.workerGroupSpecs[].template
        scaleDefinition:
          replicasPath: .spec.rayClusterSpec.workerGroupSpecs[].replicas // 1
          minReplicasPath: .spec.rayClusterSpec.workerGroupSpecs[].minReplicas
          maxReplicasPath: .spec.rayClusterSpec.workerGroupSpecs[].maxReplicas
        instanceIdPath: .spec.rayClusterSpec.workerGroupSpecs[].groupName
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: worker
          componentInstanceSelector:
            idPath: .metadata.labels["ray.io/group"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: head
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
