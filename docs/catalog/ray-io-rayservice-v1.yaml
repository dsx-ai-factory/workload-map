kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: ray-io-rayservice-v1
spec:
  structureDefinition:
    rootComponent:
      name: rayservice
      kind:
        group: ray.io
        version: v1
        kind: RayService
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          pending:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: Initializing
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true and
                      (.metadata.generation == null or .status.observedGeneration == null or
                       .status.observedGeneration >= .metadata.generation) and
                      (any(.status.conditions[]?;
                          (.status == "True" and (.type == "Suspending" or .type == "Suspended")) or
                          (.type == "Ready" and .status == "False" and
                           (.reason == "InitializingTimeout" or .reason == "ValidationFailed"))) | not)
                expectedResult: "true"
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.metadata.generation // 0) > 0 and
                                                      .spec.suspend != true and .spec.rayClusterConfig != null and
                                                      (.spec.serveConfigV2 // "") != "" and (.status == null or .status == {})
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and .spec.suspend != true and
                      (.metadata.generation == null or .status.observedGeneration == null or
                       .status.observedGeneration >= .metadata.generation) and
                      (any(.status.conditions[]?;
                          (.status == "True" and (.type == "Suspending" or .type == "Suspended")) or
                          (.type == "Ready" and .status == "False" and
                           (.reason == "InitializingTimeout" or .reason == "ValidationFailed"))) | not) and
                                                      (any(.status.conditions[]?; .status == "True" and
                                                          (.type == "UpgradeInProgress" or .type == "RollbackInProgress")) or
                                                       (((.status.pendingServiceStatus.rayClusterName // "") != "" or
                                                         (.status.activeServiceStatus.rayClusterName // "") != "") and
                                                        any(.status.conditions[]?; .type == "Ready" and .status == "False" and .reason == "Initializing")))
                expectedResult: "true"
          running:
            - byConditions:
                - type: Ready
                  status: "True"
          failed:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: InitializingTimeout
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: ValidationFailed
          degraded:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: ZeroServeEndpoints
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterConfig.headGroupSpec.template
        scaleDefinition:
          replicasPath: "1"
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterConfig.workerGroupSpecs[].template
        scaleDefinition:
          replicasPath: .spec.rayClusterConfig.workerGroupSpecs[].replicas // 1
        instanceIdPath: .spec.rayClusterConfig.workerGroupSpecs[].groupName
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: worker
          componentInstanceSelector:
            idPath: .metadata.labels["ray.io/group"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: head
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
