kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: serving-knative-dev-service-v1
spec:
  structureDefinition:
    rootComponent:
      name: knativeservice
      kind:
        group: serving.knative.dev
        version: v1
        kind: Service
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byConditions:
                - type: Ready
                  status: Unknown
              byExpression:
                expression: |-
                  (.metadata.generation == null or .status.observedGeneration == null or
                      .status.observedGeneration >= .metadata.generation)
                expectedResult: "true"
          progressing:
            - byConditions:
                - type: Ready
                  status: Unknown
              byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and (.metadata.generation == null or .status.observedGeneration == null or
                      .status.observedGeneration >= .metadata.generation) and
                                                          (any(.status.conditions[]?; (.type | IN("Ready", "ConfigurationsReady", "RoutesReady")) and .status == "Unknown" and
                                                              (.reason == "OutOfDate" or .reason == "TrafficNotMigrated")) or
                                                           ((.status.latestCreatedRevisionName // "") != "" and
                                                            .status.latestCreatedRevisionName != .status.latestReadyRevisionName))
                expectedResult: "true"
          running:
            - byConditions:
                - type: Ready
                  status: "True"
          failed:
            - byConditions:
                - type: Ready
                  status: "False"
    childComponents:
      - name: revision
        kind:
          group: serving.knative.dev
          version: v1
          kind: Revision
        ownerRef: knativeservice
        specDefinition:
          podTemplateSpecPath: .spec.template
        scaleDefinition:
          minReplicasPath: .spec.template.metadata.annotations["autoscaling.knative.dev/min-scale"] // 1 | tonumber
          maxReplicasPath: .spec.template.metadata.annotations["autoscaling.knative.dev/max-scale"] | tonumber?
    additionalChildKinds:
      - group: apps
        version: v1
        kind: Deployment
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: revision
          members:
            - componentName: revision
              groupByKeyPaths:
                - .metadata.labels["serving.knative.dev/revision"]
