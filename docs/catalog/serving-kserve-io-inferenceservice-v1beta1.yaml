kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: serving-kserve-io-inferenceservice-v1beta1
spec:
  structureDefinition:
    rootComponent:
      name: inferenceservice
      kind:
        group: serving.kserve.io
        version: v1beta1
        kind: InferenceService
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          pending:
            - byExpression:
                expression: |-
                  .metadata.deletionTimestamp == null and
                      (.metadata.generation // 0) > 0 and (.status == null or .status == {}) and ((.metadata.annotations["serving.kserve.io/stop"] // "") | ascii_downcase) != "true"
                expectedResult: "true"
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and ((any(.status.conditions[]?; .type == "PredictorReady" and .status == "False") and any(.status.conditions[]?; .type == "PredictorConfigurationReady" and .status == "False") and any(.status.conditions[]?; .type == "RoutesReady" and .status == "False")) | not) and (any(.status.conditions[]?; .type == "Ready" and .status == "True") | not) and (any(.status.conditions[]?; (.type | IN("Ready", "PredictorReady", "RoutesReady", "LatestDeploymentReady")) and .status == "Unknown") or (.status.modelStatus.states.targetModelState == "Loading" and any(.status.conditions[]?; .type == "PredictorReady" and .status == "False" and .reason == "MinimumReplicasUnavailable")))
                expectedResult: "true"
          progressing:
            - byExpression:
                expression: (.status.observedGeneration == null or .metadata.generation == null or .status.observedGeneration >= .metadata.generation) and ((any(.status.conditions[]?; .type == "PredictorReady" and .status == "False") and any(.status.conditions[]?; .type == "PredictorConfigurationReady" and .status == "False") and any(.status.conditions[]?; .type == "RoutesReady" and .status == "False")) | not) and .status.modelStatus.states.targetModelState == "Loading"
                expectedResult: "true"
          running:
            - byConditions:
                - type: PredictorReady
                  status: "True"
                - type: RoutesReady
                  status: "True"
                - type: LatestDeploymentReady
                  status: "True"
          failed:
            - byConditions:
                - type: PredictorReady
                  status: "False"
                - type: PredictorConfigurationReady
                  status: "False"
                - type: RoutesReady
                  status: "False"
    childComponents:
      - name: predictor
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: inferenceservice
        specDefinition:
          fragmentedPodSpecDefinition:
            schedulerNamePath: .spec.predictor.schedulerName
            labelsPath: .spec.predictor.labels
            annotationsPath: .spec.predictor.annotations
            podAffinityPath: .spec.predictor.affinity.podAffinity
            nodeAffinityPath: .spec.predictor.affinity.nodeAffinity
            containersPath: .spec.predictor.containers
            containerPath: .spec.predictor | ( (.[]?  | select(type =="object" and .storageUri )))
            priorityClassNamePath: .spec.predictor.priorityClassName
        scaleDefinition:
          minReplicasPath: .spec.predictor.minReplicas
          maxReplicasPath: .spec.predictor.maxReplicas
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["component"]
            value: predictor
      - name: transformer
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: inferenceservice
        specDefinition:
          podSpecPath: .spec.transformer
          metadataPath: .spec.transformer
        scaleDefinition:
          minReplicasPath: .spec.transformer.minReplicas
          maxReplicasPath: .spec.transformer.maxReplicas
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["component"]
            value: transformer
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: predictor
              groupByKeyPaths:
                - .metadata.labels["serving.kserve.io/inferenceservice"]
            - componentName: transformer
              groupByKeyPaths:
                - .metadata.labels["serving.kserve.io/inferenceservice"]
