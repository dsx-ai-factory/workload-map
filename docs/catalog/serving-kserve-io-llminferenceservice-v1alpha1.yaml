kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: serving-kserve-io-llminferenceservice-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: llminferenceservice
      kind:
        group: serving.kserve.io
        version: v1alpha1
        kind: LLMInferenceService
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: reason
        statusMappings:
          initializing:
            - byExpression:
                expression: any(.status.conditions[]?; .type == "Ready" and .status == "Unknown") and (any(.status.conditions[]?; .type == "PresetsCombined" and .status == "False") | not)
                expectedResult: "true"
            - byExpression:
                expression: any(.status.conditions[]?; .type == "Ready" and .status == "False" and (.reason | IN("Progressing", "MinimumReplicasUnavailable", "WaitingForGateway", "GatewaysNotReady", "HTTPRoutesNotReady", "InferencePoolNotReady", "HPAProgressing", "ScaledObjectProgressing", "AllGroupsReady")))
                expectedResult: "true"
          running:
            - byConditions:
                - type: Ready
                  status: "True"
          failed:
            - byExpression:
                expression: any(.status.conditions[]?; .type == "Ready" and .status == "False" and (.reason | IN("Progressing", "MinimumReplicasUnavailable", "WaitingForGateway", "GatewaysNotReady", "HTTPRoutesNotReady", "InferencePoolNotReady", "HPAProgressing", "ScaledObjectProgressing", "AllGroupsReady", "Stopped") | not))
                expectedResult: "true"
            - byExpression:
                expression: any(.status.conditions[]?; .type == "Ready" and .status == "Unknown") and (any(.status.conditions[]?; .type == "PresetsCombined" and .status == "False" and .reason != "Stopped"))
                expectedResult: "true"
          suspended:
            - byConditions:
                - type: Ready
                  status: "False"
                  reason: Stopped
            - byConditions:
                - type: PresetsCombined
                  status: "False"
                  reason: Stopped
    childComponents:
      - name: main
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: (select(.spec.worker == null) | .spec.template)
        scaleDefinition:
          replicasPath: (select(.spec.worker == null) | .spec.replicas)
          minReplicasPath: (select(.spec.worker == null) | .spec.scaling.minReplicas)
          maxReplicasPath: (select(.spec.worker == null) | .spec.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload
      - name: prefill
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: (select(.spec.prefill.worker == null) | .spec.prefill.template)
        scaleDefinition:
          replicasPath: (select(.spec.prefill.worker == null) | .spec.prefill.replicas)
          minReplicasPath: (select(.spec.prefill.worker == null) | .spec.prefill.scaling.minReplicas)
          maxReplicasPath: (select(.spec.prefill.worker == null) | .spec.prefill.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload-prefill
      - name: worker
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: .spec.worker
        scaleDefinition:
          replicasPath: (select(.spec.worker != null) | .spec.replicas)
          minReplicasPath: (select(.spec.worker != null) | .spec.scaling.minReplicas)
          maxReplicasPath: (select(.spec.worker != null) | .spec.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload-worker
      - name: leader
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: (select(.spec.worker != null) | .spec.template)
        scaleDefinition:
          replicasPath: (select(.spec.worker != null) | .spec.replicas)
          minReplicasPath: (select(.spec.worker != null) | .spec.scaling.minReplicas)
          maxReplicasPath: (select(.spec.worker != null) | .spec.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload-leader
      - name: prefill-leader
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: (select(.spec.prefill.worker != null) | .spec.prefill.template)
        scaleDefinition:
          replicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.replicas)
          minReplicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.scaling.minReplicas)
          maxReplicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload-leader-prefill
      - name: prefill-worker
        kind:
          group: leaderworkerset.x-k8s.io
          version: v1
          kind: LeaderWorkerSet
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: .spec.prefill.worker
        scaleDefinition:
          replicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.replicas)
          minReplicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.scaling.minReplicas)
          maxReplicasPath: (select(.spec.prefill.worker != null) | .spec.prefill.scaling.maxReplicas)
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-workload-worker-prefill
      - name: router-scheduler
        kind:
          group: apps
          version: v1
          kind: Deployment
        ownerRef: llminferenceservice
        specDefinition:
          podSpecPath: .spec.router.scheduler.template
        scaleDefinition:
          replicasPath: .spec.router.scheduler.replicas
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["app.kubernetes.io/component"]
            value: llminferenceservice-router-scheduler
    additionalChildKinds:
      - group: leaderworkerset.x-k8s.io
        version: v1
        kind: LeaderWorkerSet
      - group: inference.networking.k8s.io
        version: v1
        kind: InferencePool
      - group: gateway.networking.k8s.io
        version: v1
        kind: HTTPRoute
      - group: ""
        version: v1
        kind: Service
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: main
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
            - componentName: prefill
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
                - .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"] // "0"
            - componentName: leader
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
                - .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"] // "0"
            - componentName: prefill-leader
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
                - .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"] // "0"
            - componentName: prefill-worker
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
                - .metadata.labels["leaderworkerset.sigs.k8s.io/group-index"] // "0"
            - componentName: router-scheduler
              groupByKeyPaths:
                - .metadata.labels["app.kubernetes.io/name"]
