apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: ray-io-rayjob-v1
spec:
  structureDefinition:
    rootComponent:
      name: rayjob
      kind:
        group: ray.io
        version: v1
        kind: RayJob
      suspendDefinition:
        suspendActions:
          - path: .spec.suspend
            value: "true"
        resumeActions:
          - path: .spec.suspend
            value: "false"
      statusDefinition:
        phaseDefinition:
          path: .status.jobStatus
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
          reasonFieldName: null
        statusMappings:
          initializing:
          - byPhase: PENDING
          running:
          - byPhase: RUNNING
          completed:
          - byPhase: SUCCEEDED
          failed:
          - byPhase: FAILED
          suspended:
          - byExpression:
              expression: .status.jobDeploymentStatus == "Suspended"
              expectedResult: "true"
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayjob
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterSpec.headGroupSpec.template
        scaleDefinition:
          replicasPath: "1"
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayjob
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterSpec.workerGroupSpecs[]?.template
        scaleDefinition:
          replicasPath: .spec.rayClusterSpec.workerGroupSpecs[]? | (.replicas // 1)
        instanceIdPath: .spec.rayClusterSpec.workerGroupSpecs[]?.groupName
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: worker
          componentInstanceSelector:
            idPath: .metadata.labels["ray.io/group"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: job
          members:
            - componentName: head
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
