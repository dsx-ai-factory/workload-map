apiVersion: run.ai/v1alpha1
kind: Karta
metadata:
  name: ray-io-rayservice-v1
spec:
  structureDefinition:
    rootComponent:
      name: rayservice
      kind:
        group: ray.io
        version: v1
        kind: RayService
      statusDefinition:
        conditionsDefinition:
          path: .status.conditions
          typeFieldName: type
          statusFieldName: status
          reasonFieldName: reason
          messageFieldName: message
        statusMappings:
          running:
          - byConditions:
              - type: Ready
                status: "True"
          initializing:
          - byConditions:
              - type: Ready
                status: "False"
                reason: Initializing
          degraded:
          - byConditions:
              - type: Ready
                status: "False"
                reason: ZeroServeEndpoints
          failed:
          - byConditions:
              - type: Ready
                status: "False"
                reason: InitializingTimeout
          - byConditions:
              - type: Ready
                status: "False"
                reason: ValidationFailed
    childComponents:
      - name: head
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterConfig.headGroupSpec.template
        scaleDefinition:
          replicasPath: "1"
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: head
      - name: worker
        kind:
          group: ""
          version: v1
          kind: Pod
        ownerRef: rayservice
        specDefinition:
          podTemplateSpecPath: .spec.rayClusterConfig.workerGroupSpecs[]?.template
        scaleDefinition:
          replicasPath: .spec.rayClusterConfig.workerGroupSpecs[]? | (.replicas // 1)
        instanceIdPath: .spec.rayClusterConfig.workerGroupSpecs[]?.groupName
        podSelector:
          componentTypeSelector:
            keyPath: .metadata.labels["ray.io/node-type"]
            value: worker
          componentInstanceSelector:
            idPath: .metadata.labels["ray.io/group"]
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: head
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
            - componentName: worker
              groupByKeyPaths:
                - .metadata.labels["ray.io/cluster"]
