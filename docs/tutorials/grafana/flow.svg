<svg xmlns="http://www.w3.org/2000/svg" width="984" height="369" viewBox="0 0 984 369" role="img">
<title>From workload inventory to individual Pods</title>
<rect x="0" y="0" width="984" height="369" rx="0" fill="white" stroke="white" stroke-width="1.5"/>
<text x="28" y="44" fill="#192c42" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start">From workload inventory to individual Pods</text>
<rect x="28" y="78" width="346" height="258" rx="11" fill="#f4f8fd" stroke="#c8d5e1" stroke-width="1.5"/>
<text x="48" y="121" fill="#192c42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Workload Overview</text>
<text x="48" y="162" fill="#455d73" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Choose a cluster, namespace</text>
<text x="48" y="190" fill="#455d73" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">and time range.</text>
<rect x="47" y="221" width="306" height="79" rx="7" fill="white" stroke="#c8d5e1" stroke-width="1.5"/>
<text x="62" y="250" fill="#455d73" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Workload inventory</text>
<text x="62" y="281" fill="#245ab1" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" text-anchor="start">Select a workload name</text>
<polyline points="375,207 532,207" fill="none" stroke="#245ab1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="524,211 532,207 524,203" fill="none" stroke="#245ab1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="453.5" y="195" fill="#245ab1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" text-anchor="middle">opens by UID</text>
<rect x="533" y="78" width="423" height="258" rx="11" fill="white" stroke="#c8d5e1" stroke-width="1.5"/>
<text x="553" y="121" fill="#192c42" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start">Workload Structure</text>
<text x="553" y="160" fill="#455d73" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start">Same namespace scope and time range</text>
<text x="553" y="207" fill="#176648" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start">Workload</text>
<polyline points="564,219 564,245 588,245" fill="none" stroke="#699583" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="251" fill="#192c42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Component and instance</text>
<polyline points="612,263 612,288 636,288" fill="none" stroke="#699583" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="648" y="294" fill="#192c42" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">Replica group and Pods</text>
</svg>
