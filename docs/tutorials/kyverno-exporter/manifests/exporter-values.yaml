operator:
  enabled: false
webhook:
  enabled: false
crdUpgrader:
  enabled: false
exporter:
  enabled: true
  selection:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: ai-lab}
      matchExpressions: []
    includeRootResources:
      - apiGroups: [kubeflow.org]
        apiVersions: [v1]
        resources: [pytorchjobs]
      - apiGroups: [apps]
        apiVersions: [v1]
        resources: [deployments]
    requiredWatchKinds: [kubeflow.org/v1/PyTorchJob, apps/v1/Deployment]
  kartaDefinitionSource:
    catalog:
      enabled: true
      include: [kubeflow-org-pytorchjob-v1, apps-deployment-v1]
    cluster:
      enabled: false
  rbac:
    workloadRules:
      - apiGroups: [kubeflow.org]
        resources: [pytorchjobs]
      - apiGroups: [apps]
        resources: [deployments, replicasets]
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
