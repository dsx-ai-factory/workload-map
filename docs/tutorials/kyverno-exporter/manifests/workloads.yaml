apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: idle-training
  namespace: ai-lab
  labels:
    tutorial.karta.run.ai/action: suspend
spec:
  runPolicy:
    suspend: false
    cleanPodPolicy: All
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.37.0
              command: [sh, -c, "sleep 3600"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {nvidia.com/gpu: 1, cpu: 100m, memory: 32Mi}
---
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: failed-training
  namespace: ai-lab
  labels:
    tutorial.karta.run.ai/action: delete
spec:
  runPolicy:
    cleanPodPolicy: None
    backoffLimit: 0
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.37.0
              command: [sh, -c, "exit 1"]
              resources:
                requests: {cpu: 5m, memory: 8Mi}
                limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: degraded-service
  namespace: ai-lab
  labels:
    tutorial.karta.run.ai/action: delete
spec:
  replicas: 1
  progressDeadlineSeconds: 10
  selector:
    matchLabels: {app: degraded-service}
  strategy:
    canary: {}
  template:
    metadata:
      labels: {app: degraded-service}
    spec:
      containers:
        - name: app
          image: busybox:1.37.0
          command: [sh, -c, "sleep 3600"]
          readinessProbe:
            exec: {command: [sh, -c, "exit 1"]}
            periodSeconds: 2
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
