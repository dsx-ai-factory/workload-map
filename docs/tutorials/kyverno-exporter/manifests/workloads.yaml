apiVersion: batch/v1
kind: Job
metadata:
  name: idle-training
  namespace: ai-lab
  labels:
    tutorial.workloadmap.run.ai/action: suspend
spec:
  suspend: false
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: busybox:1.37.0
          command: [sh, -c, "sleep 3600"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {nvidia.com/gpu: 1, cpu: 100m, memory: 32Mi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: failed-training
  namespace: ai-lab
  labels:
    tutorial.workloadmap.run.ai/action: delete
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: training
          image: busybox:1.37.0
          command: [sh, -c, "exit 1"]
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failed-service
  namespace: ai-lab
  labels:
    tutorial.workloadmap.run.ai/action: delete
spec:
  replicas: 1
  progressDeadlineSeconds: 10
  selector:
    matchLabels: {app: failed-service}
  template:
    metadata:
      labels: {app: failed-service}
    spec:
      containers:
        - name: app
          image: busybox:1.37.0
          command: [sh, -c, "sleep 3600"]
          readinessProbe:
            exec: {command: [sh, -c, "exit 1"]}
            periodSeconds: 2
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
