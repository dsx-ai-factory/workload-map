  - series: DCGM_FI_DEV_GPU_UTIL{namespace="ai-lab",pod_uid="wrong-pod",UUID="GPU-a"}
    values: 1+0x70
  promql_expr_test:
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 150s
    exp_samples: []
