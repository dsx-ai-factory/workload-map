rule_files:
- ../manifests/prometheus-rules.yaml
evaluation_interval: 5s
tests:
- name: idle requires full two-minute boundary
  interval: 5s
  input_series:
  - series: up{job="dsx-exporter"}
    values: 1+0x70
  - series: up{job="dcgm"}
    values: 1+0x70
  - series: dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",phase="Running",observation_valid="true"}
    values: 1+0x70
  - series: dsx_workload_pod_info{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",pod_uid="p1",component="job",observation_valid="true"}
    values: 1+0x70
  - series: DCGM_FI_DEV_GPU_UTIL{namespace="ai-lab",pod_uid="p1",UUID="GPU-a"}
    values: 1+0x70
  promql_expr_test:
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 115s
    exp_samples: []
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 120s
    exp_samples:
    - labels: '{}'
      value: 1
  - expr: tutorial:gpu_idle:eligible
    eval_time: 120s
    exp_samples:
    - labels: 'tutorial:gpu_idle:eligible{namespace="ai-lab",workload_uid="w1",pod_uid="p1",UUID="GPU-a"}'
      value: 1
- name: busy sample starts a new idle window
  interval: 5s
  input_series:
  - series: up{job="dsx-exporter"}
    values: 1+0x70
  - series: up{job="dcgm"}
    values: 1+0x70
  - series: dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",phase="Running",observation_valid="true"}
    values: 1+0x70
  - series: dsx_workload_pod_info{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",pod_uid="p1",component="job",observation_valid="true"}
    values: 1+0x70
  - series: DCGM_FI_DEV_GPU_UTIL{namespace="ai-lab",pod_uid="p1",UUID="GPU-a"}
    values: 90+0x12 1+0x60
  promql_expr_test:
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 120s
    exp_samples: []
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 180s
    exp_samples: []
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 185s
    exp_samples:
    - labels: '{}'
      value: 1
- name: missing GPU sample restarts coverage
  interval: 5s
  input_series:
  - series: up{job="dsx-exporter"}
    values: 1+0x70
  - series: up{job="dcgm"}
    values: 1+0x70
  - series: dsx_workload_status{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",phase="Running",observation_valid="true"}
    values: 1+0x70
  - series: dsx_workload_pod_info{namespace="ai-lab",workload_group="batch",workload_kind="Job",workload_uid="w1",pod_uid="p1",component="job",observation_valid="true"}
    values: 1+0x70
  - series: DCGM_FI_DEV_GPU_UTIL{namespace="ai-lab",pod_uid="p1",UUID="GPU-a"}
    values: 1+0x11 stale 1+0x60
  promql_expr_test:
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 120s
    exp_samples: []
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 180s
    exp_samples: []
  - expr: count(tutorial:gpu_idle:eligible)
    eval_time: 185s
    exp_samples:
    - labels: '{}'
      value: 1
- name: wrong Pod UID cannot join
  interval: 5s
