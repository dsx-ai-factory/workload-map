- name: Missing MIG profiling cannot fall back to parent utilization
  interval: 1m
  input_series:
  - series: up{job="exporter"}
    values: '1'
  - series: up{job="dcgm"}
    values: '1'
  - series: dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="active",pod_uid="active",workload_name="root",workload_uid="multi",component="active",component_instance="i0",observation_valid="true"}
    values: '1'
  - series: dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="quiet",pod_uid="quiet",workload_name="root",workload_uid="multi",component="quiet",component_instance="i0",observation_valid="true"}
    values: '1'
  - series: DCGM_FI_DEV_GPU_UTIL{job="dcgm",namespace="ns",pod_uid="active",UUID="gpu-mig",gpu="0"}
    values: '99'
  - series: DCGM_FI_DEV_GPU_UTIL{job="dcgm",namespace="ns",pod_uid="active",UUID="gpu-mig",gpu="0",GPU_I_ID="1",GPU_CI_ID="0"}
    values: '99'
  - series: DCGM_FI_DEV_GPU_UTIL{job="dcgm",namespace="ns",pod_uid="quiet",UUID="gpu-mig",gpu="0"}
    values: '99'
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="quiet",UUID="gpu-mig",gpu="0",GPU_I_ID="2"}
    values: '256'
  promql_expr_test:
  - expr: *components
    eval_time: 0m
    exp_samples: []
  - expr: *history
    eval_time: 0m
    exp_samples: []
  - expr: *count
    eval_time: 0m
    exp_samples: []
