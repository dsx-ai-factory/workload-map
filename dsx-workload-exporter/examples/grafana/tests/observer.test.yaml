d (time() - timestamp(workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!=""}) < 45)))) unless on (namespace, workload_uid) (max by (namespace, workload, workload_uid, workload_kind, state, reason) ((workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!=""} and (time() - timestamp(workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!=""}) < 45))) != min by (namespace, workload, workload_uid, workload_kind, state, reason) ((workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!=""} and (time() - timestamp(workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!=""}) < 45))))) and on () (min(up{job=~"observer"}) == 1) and on (namespace, workload_uid) (dsx:workload:observed{job=~"exporter", namespace=~"ns", workload_name=~".*"})) == 1)) != 1)) and on (namespace, workload_uid, state, reason) (workload_gpu_observer_state{job=~"observer", namespace=~"ns", workload=~".*", workload_uid!="", state="unknown"} == 1))) > 0)
