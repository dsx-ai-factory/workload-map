      - expr: *active_count
        eval_time: 30s
        exp_samples: []
      - expr: *active_count
        eval_time: 45s
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: *active_count
        eval_time: 105s
        exp_samples: []

  - name: An absent observer does not become zero activity
    interval: 15s
    input_series:
      - series: 'up{job="other-observer"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="root",workload_uid="root"}'
        values: '10x2'
    promql_expr_test:
      - expr: *active_count
        eval_time: 0s
        exp_samples: []

  - name: Zero active workloads requires valid low activity evidence
    interval: 15s
    input_series:
      - series: 'up{job="observer"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="root",workload_uid="root"}'
        values: '10x2'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="active",reason="measured"}'
        values: '0x2'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="low_activity",reason="measured"}'
        values: '1x2'
    promql_expr_test:
      - expr: *active_count
        eval_time: 0s
        exp_samples:
          - labels: '{}'
            value: 0

  - name: Conflicting states are rejected
    interval: 15s
    input_series:
      - series: 'up{job="observer"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="root",workload_uid="root"}'
        values: '10x2'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="active",reason="measured"}'
        values: '1x2'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="low_activity",reason="measured"}'
        values: '1x2'
    promql_expr_test:
      - expr: *active_count
        eval_time: 0s
        exp_samples: []

  - name: An old Active sample cannot override a fresh Low activity state
    interval: 1m
    input_series:
      - series: 'up{job="observer"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="root",workload_uid="root"}'
        values: '10x2'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="active",reason="measured"}'
        values: '1 _ _'
      - series: 'workload_gpu_observer_state{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment",state="low_activity",reason="measured"}'
        values: '_ _ 1'
    promql_expr_test:
      - expr: *active_count
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 0

  - name: Conflicting observer metadata cannot count one workload UID twice
    interval: 1m
    input_series:
      - series: 'up{job="observer"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="root",workload_uid="root"}'
        values: '10x2'
      - series: 'workload_gpu_observer_assigned_devices{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Job"}'
        values: '2x2'
      - series: 'workload_gpu_observer_assigned_devices{job="observer",namespace="ns",workload="root",workload_uid="root",workload_kind="Deployment"}'
        values: '3x2'
