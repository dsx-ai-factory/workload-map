rule_files:
- ../recording-rules.yaml
evaluation_interval: 30s
tests:
- name: Shared device counts once and conflicting readings are excluded
  interval: 1m
  input_series:
  - &exporter_up
    series: up{job="exporter"}
    values: 1x2 0
  - &dcgm_up
    series: up{job="dcgm"}
    values: 1x3
  - &first_pod
    series: dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="p1",pod_uid="p1",workload_name="root",workload_uid="multi",observation_valid="true"}
    values: 1x4
  - &second_pod
    series: dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="p2",pod_uid="p2",workload_name="root",workload_uid="multi",observation_valid="true"}
    values: 1x4
  - &third_pod
    series: dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="p3",pod_uid="p3",workload_name="root",workload_uid="multi",observation_valid="true"}
    values: 1x4
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p1",UUID="device-a",gpu="0"}
    values: 512x3
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p2",UUID="device-a",gpu="4"}
    values: 512 512 768 512
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p3",UUID="device-b"}
    values: 256x3
  promql_expr_test:
  # dashboard-expression: workload-overview.json 17 A
  - expr: |-
      (sum by (namespace, workload_name, workload_uid) ((max by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"})) == min by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"}))))) and on () (min(up{job=~"exporter"}) == 1) and on () (min(up{job=~"dcgm"}) == 1)
    eval_time: 1m
    exp_samples:
    - labels: '{namespace="ns",workload_name="root",workload_uid="multi"}'
      value: 805306368
  - expr: |-
      (sum by (namespace, workload_name, workload_uid) ((max by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"})) == min by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"}))))) and on () (min(up{job=~"exporter"}) == 1) and on () (min(up{job=~"dcgm"}) == 1)
    eval_time: 2m
    exp_samples:
    - labels: '{namespace="ns",workload_name="root",workload_uid="multi"}'
      value: 268435456
  - expr: |-
      (sum by (namespace, workload_name, workload_uid) ((max by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"})) == min by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"}))))) and on () (min(up{job=~"exporter"}) == 1) and on () (min(up{job=~"dcgm"}) == 1)
    eval_time: 3m
    exp_samples: []
- name: Distinct MIG entities retain separate framebuffer measurements
  interval: 1m
  input_series:
  - *exporter_up
  - *dcgm_up
  - *first_pod
  - *second_pod
  - *third_pod
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p1",UUID="device-a",GPU_I_ID="1",GPU_CI_ID="0"}
    values: 128x3
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p2",UUID="device-a",GPU_I_ID="1",GPU_CI_ID="0",gpu="4"}
    values: 128x3
  - series: DCGM_FI_DEV_FB_USED{job="dcgm",namespace="ns",pod_uid="p3",UUID="device-a",GPU_I_ID="2",GPU_CI_ID="0"}
    values: 256x3
  promql_expr_test:
  - expr: |-
      (sum by (namespace, workload_name, workload_uid) ((max by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"})) == min by (namespace, workload_name, workload_uid, UUID, GPU_I_ID, GPU_CI_ID) ((((max by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""}) == min by (namespace, pod_uid, UUID, gpu, GPU_I_ID, GPU_CI_ID) (DCGM_FI_DEV_FB_USED{job=~"dcgm", namespace=~"ns", pod_uid!="", UUID!=""})) >= 0) * 1048576) * on (namespace, pod_uid) group_left (workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", observation_valid="true"}))))) and on () (min(up{job=~"exporter"}) == 1) and on () (min(up{job=~"dcgm"}) == 1)
    eval_time: 1m
    exp_samples:
    - labels: '{namespace="ns",workload_name="root",workload_uid="multi"}'
      value: 402653184
