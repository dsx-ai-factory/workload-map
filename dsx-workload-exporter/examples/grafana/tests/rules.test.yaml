rule_files:
  - ../recording-rules.yaml
  - ../alerting-rules.yaml
evaluation_interval: 30s

tests:
  - name: Empty input stays absent
    interval: 1m
    promql_expr_test:
      - expr: dsx:workload:observed
        eval_time: 1m
        exp_samples: []
      - expr: dsx:pod_attribution:unique
        eval_time: 1m
        exp_samples: []
    alert_rule_test:
      - alertname: DSXExporterObservationFailure
        eval_time: 10m
        exp_alerts: []

  - name: Inventory includes zero-Pod, all-zero, overlapping, retained and failure-only roots
    interval: 1m
    input_series:
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="zero-pod",workload_uid="zero"}'
        values: '10'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",karta="",phase="Running",observation_valid="true"}'
        values: '0'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",karta="",phase="Failed",observation_valid="true"}'
        values: '0'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",phase="Running",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",phase="Degraded",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",workload_name="retained",workload_uid="retained",pod_name="retained-0",pod_uid="pod-retained",observation_valid="false"}'
        values: '1'
      - series: 'dsx_exporter_observation_valid{job="exporter",namespace="ns",scope="workload",workload_name="failed",workload_uid="failed",reason="evaluation_failed"}'
        values: '0'
      - series: 'dsx_exporter_observation_valid{job="exporter",namespace="ns",scope="discovery",workload_name="",workload_uid="",reason="unresolved_owner"}'
        values: '0'
      - series: 'dsx_exporter_observation_valid{job="exporter",namespace="ns",scope="workload",workload_name="unknown",workload_uid="",reason="evaluation_failed"}'
        values: '0'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="replacement",workload_uid="old"}'
        values: '10'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="replacement",workload_uid="new"}'
        values: '20'
      - series: 'dsx_workload_status{job="other-exporter",namespace="ns",workload_name="multi",workload_uid="multi",phase="Running",observation_valid="true"}'
        values: '1'
    promql_expr_test:
      - expr: dsx:workload:observed
        eval_time: 0m
        exp_samples:
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="zero-pod",workload_uid="zero"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="retained",workload_uid="retained"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="failed",workload_uid="failed"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="replacement",workload_uid="old"}'
            value: 1
          - labels: 'dsx:workload:observed{job="exporter",namespace="ns",workload_name="replacement",workload_uid="new"}'
            value: 1
          - labels: 'dsx:workload:observed{job="other-exporter",namespace="ns",workload_name="multi",workload_uid="multi"}'
            value: 1

  - name: Deduplicate identical replicas and reject UID, validity and configured-label conflicts
    interval: 1m
    input_series:
      - series: 'dsx_workload_pod_info{job="exporter",instance="a",namespace="ns",pod_name="same",pod_uid="pod",workload_name="root",workload_uid="root-uid",workload_group="apps",workload_version="v1",workload_kind="Deployment",owner_resolution="resolved",component="service",component_instance="api",replica_group_id="group-a",observation_valid="true",team="research"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",instance="b",namespace="ns",pod_name="same",pod_uid="pod",workload_name="root",workload_uid="root-uid",workload_group="apps",workload_version="v1",workload_kind="Deployment",owner_resolution="resolved",component="service",component_instance="api",replica_group_id="group-a",observation_valid="true",team="research"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="no-team",pod_uid="no-team",workload_name="root",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="invalid",pod_uid="invalid",workload_name="root",workload_uid="root-uid",observation_valid="false"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="other-exporter",namespace="ns",pod_name="same",pod_uid="different-job",workload_name="root",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="uid-conflict",pod_uid="old",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="uid-conflict",pod_uid="new",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="root-conflict",pod_uid="same",workload_uid="old",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="root-conflict",pod_uid="same",workload_uid="new",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="validity-conflict",pod_uid="same",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="validity-conflict",pod_uid="same",workload_uid="root-uid",observation_valid="false"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="team-conflict",pod_uid="same",workload_uid="root-uid",observation_valid="true",team="research"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="team-conflict",pod_uid="same",workload_uid="root-uid",observation_valid="true",team="operations"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="team-missing",pod_uid="same",workload_uid="root-uid",observation_valid="true",team="research"}'
        values: '1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="team-missing",pod_uid="same",workload_uid="root-uid",observation_valid="true"}'
        values: '1'
    promql_expr_test:
      - expr: dsx:pod_attribution:unique
        eval_time: 0m
        exp_samples:
          - labels: 'dsx:pod_attribution:unique{job="exporter",namespace="ns",pod_name="same",pod_uid="pod",workload_name="root",workload_uid="root-uid",workload_group="apps",workload_version="v1",workload_kind="Deployment",owner_resolution="resolved",component="service",component_instance="api",replica_group_id="group-a",observation_valid="true",team="research"}'
            value: 1
          - labels: 'dsx:pod_attribution:unique{job="exporter",namespace="ns",pod_name="no-team",pod_uid="no-team",workload_name="root",workload_uid="root-uid",observation_valid="true"}'
            value: 1
          - labels: 'dsx:pod_attribution:unique{job="exporter",namespace="ns",pod_name="invalid",pod_uid="invalid",workload_name="root",workload_uid="root-uid",observation_valid="false"}'
            value: 1
          - labels: 'dsx:pod_attribution:unique{job="other-exporter",namespace="ns",pod_name="same",pod_uid="different-job",workload_name="root",workload_uid="root-uid",observation_valid="true"}'
            value: 1
      - expr: count(dsx:pod_attribution:unique{job="exporter",observation_valid="true"})
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 2

  - name: Stale and disappeared inputs stop contributing without zero filling
    interval: 1m
    input_series:
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="stale",pod_uid="stale",workload_name="stale",workload_uid="stale",observation_valid="true"}'
        values: '1 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="disappeared",workload_uid="disappeared"}'
        values: '10 _x7'
    promql_expr_test:
      - expr: dsx:pod_attribution:unique
        eval_time: 1m
        exp_samples: []
      - expr: dsx:workload:observed{workload_uid="stale"}
        eval_time: 1m
        exp_samples: []
      - expr: dsx:workload:observed
        eval_time: 7m
        exp_samples: []

  - name: Observation alert waits five minutes and resolves on recovery or staleness
    interval: 1m
    input_series:
      - series: 'dsx_exporter_observation_valid{job="exporter",instance="a",namespace="ns",scope="resource_type",resource_group="apps",resource_version="v1",resource_kind="Deployment",reason="permission_denied"}'
        values: '1 0x5 1'
      - series: 'dsx_exporter_observation_valid{job="exporter",instance="b",namespace="ns",scope="workload",workload_name="root",workload_uid="root-uid",reason="evaluation_failed"}'
        values: '_ 0x5 stale'
    alert_rule_test:
      - alertname: DSXExporterObservationFailure
        eval_time: 5m30s
        exp_alerts: []
      - alertname: DSXExporterObservationFailure
        eval_time: 6m
        exp_alerts:
          - exp_labels:
              job: exporter
              instance: a
              namespace: ns
              scope: resource_type
              resource_group: apps
              resource_version: v1
              resource_kind: Deployment
              reason: permission_denied
              severity: warning
            exp_annotations:
              summary: DSX exporter reports an observation failure
              description: Target a reports permission_denied for scope resource_type.
          - exp_labels:
              job: exporter
              instance: b
              namespace: ns
              scope: workload
              workload_name: root
              workload_uid: root-uid
              reason: evaluation_failed
              severity: warning
            exp_annotations:
              summary: DSX exporter reports an observation failure
              description: Target b reports evaluation_failed for scope workload.
      - alertname: DSXExporterObservationFailure
        eval_time: 7m
        exp_alerts: []

  - name: Dashboard phases require replica agreement and current successful scrapes
    interval: 1m
    input_series:
      - series: 'up{job="exporter",instance="a"}'
        values: '1 1 stale 1 1'
      - series: 'up{job="exporter",instance="b"}'
        values: '1 0 stale 1 1'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",observation_valid="true",karta="deployment",karta_source="catalog",instance="a",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",observation_valid="true",karta="deployment",karta_source="catalog",instance="b",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",observation_valid="true",karta="deployment",karta_source="catalog",instance="a",phase="Degraded"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Initializing"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Running"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Completed"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Failed"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Degraded"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Suspended"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Suspending"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Resuming"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="unmapped",workload_uid="unmapped",observation_valid="true",karta="",karta_source="",phase="Undefined"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="value-conflict",workload_uid="value-conflict",observation_valid="true",karta="deployment",karta_source="catalog",instance="a",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="value-conflict",workload_uid="value-conflict",observation_valid="true",karta="deployment",karta_source="catalog",instance="b",phase="Running"}'
        values: '0x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="metadata-conflict",workload_uid="metadata-conflict",observation_valid="true",karta="deployment",karta_source="catalog",team="research",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="metadata-conflict",workload_uid="metadata-conflict",observation_valid="true",karta="deployment",karta_source="catalog",team="operations",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="invalid",workload_uid="invalid",observation_valid="true",karta="deployment",karta_source="catalog",phase="Running"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="invalid",workload_uid="invalid",observation_valid="false",karta="deployment",karta_source="catalog",phase="Failed"}'
        values: '1x3 stale'
      - series: 'dsx_workload_status{job="other-exporter",namespace="ns",workload_name="multi",workload_uid="multi",observation_valid="true",karta="deployment",karta_source="catalog",phase="Running"}'
        values: '1x3 stale'
    promql_expr_test:
      # dashboard-expression: workload-overview.json 3 A
      - expr: &dashboard_phases |-
          sum by (phase) (((min by (job, namespace, workload_name, workload_uid, phase) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_name=~".*", observation_valid="true"}) == max by (job, namespace, workload_name, workload_uid, phase) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_name=~".*", observation_valid="true"})) unless on (job, namespace, workload_name, workload_uid) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_name=~".*", observation_valid!="true"}) unless on (job, namespace, workload_name, workload_uid, phase) (count by (job, namespace, workload_name, workload_uid, phase) (group by (job, namespace, workload_name, workload_uid, phase, workload_group, workload_version, workload_kind, owner_resolution, karta, karta_source, observation_valid, team) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_name=~".*"})) != 1)) and on () (min(up{job=~"exporter"}) == 1))
        eval_time: 0m
        exp_samples: &phase_matches
          - labels: '{phase="Initializing"}'
            value: 0
          - labels: '{phase="Running"}'
            value: 1
          - labels: '{phase="Completed"}'
            value: 0
          - labels: '{phase="Failed"}'
            value: 0
          - labels: '{phase="Degraded"}'
            value: 1
          - labels: '{phase="Suspended"}'
            value: 0
          - labels: '{phase="Suspending"}'
            value: 0
          - labels: '{phase="Resuming"}'
            value: 0
          - labels: '{phase="Undefined"}'
            value: 0
      - expr: *dashboard_phases
        eval_time: 1m
        exp_samples: []
      - expr: *dashboard_phases
        eval_time: 2m
        exp_samples: []
      - expr: *dashboard_phases
        eval_time: 3m
        exp_samples: *phase_matches
      - expr: *dashboard_phases
        eval_time: 4m
        exp_samples: []
      # dashboard-expression: workload-structure.json 3 A
      - expr: |-
          ((min by (job, namespace, workload_name, workload_uid, phase) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_uid=~"multi", observation_valid="true"}) == max by (job, namespace, workload_name, workload_uid, phase) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_uid=~"multi", observation_valid="true"})) unless on (job, namespace, workload_name, workload_uid) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_uid=~"multi", observation_valid!="true"}) unless on (job, namespace, workload_name, workload_uid, phase) (count by (job, namespace, workload_name, workload_uid, phase) (group by (job, namespace, workload_name, workload_uid, phase, workload_group, workload_version, workload_kind, owner_resolution, karta, karta_source, observation_valid, team) (dsx_workload_status{job=~"exporter", namespace=~"ns", workload_uid=~"multi"})) != 1)) and on () (min(up{job=~"exporter"}) == 1)
        eval_time: 0m
        exp_samples:
          - labels: '{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",phase="Running"}'
            value: 1
          - labels: '{job="exporter",namespace="ns",workload_name="multi",workload_uid="multi",phase="Degraded"}'
            value: 1

  - name: Dashboard age requires timestamp agreement and keeps workload lifetimes separate
    interval: 1m
    input_series:
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="same",workload_uid="same",instance="a"}'
        values: '100x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="same",workload_uid="same",instance="b"}'
        values: '100x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="conflict",workload_uid="conflict",instance="a"}'
        values: '100x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="conflict",workload_uid="conflict",instance="b"}'
        values: '200x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="replacement",workload_uid="old"}'
        values: '100x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="replacement",workload_uid="new"}'
        values: '200x10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="other-exporter",namespace="ns",workload_name="same",workload_uid="same"}'
        values: '999x10 stale'
      - series: 'dsx_workload_status{job="exporter",namespace="ns",workload_name="missing",workload_uid="missing",phase="Running",observation_valid="true"}'
        values: '1x10 stale'
    promql_expr_test:
      # dashboard-expression: workload-overview.json 4 B
      - expr: &dashboard_age |-
          (time() - (min by (job, namespace, workload_name, workload_uid) (dsx_workload_created_timestamp_seconds{job=~"exporter", namespace=~"ns", workload_name=~".*"}) == max by (job, namespace, workload_name, workload_uid) (dsx_workload_created_timestamp_seconds{job=~"exporter", namespace=~"ns", workload_name=~".*"}))) and on (job, namespace, workload_name, workload_uid) (dsx:workload:observed{job=~"exporter", namespace=~"ns", workload_name=~".*"})
        eval_time: 10m
        exp_samples:
          - labels: '{job="exporter",namespace="ns",workload_name="same",workload_uid="same"}'
            value: 500
          - labels: '{job="exporter",namespace="ns",workload_name="replacement",workload_uid="old"}'
            value: 500
          - labels: '{job="exporter",namespace="ns",workload_name="replacement",workload_uid="new"}'
            value: 400
      - expr: *dashboard_age
        eval_time: 11m
        exp_samples: []

  - name: Published mapping count alone may zero-fill observed roots
    interval: 1m
    input_series:
      - series: 'up{job="exporter"}'
        values: '1x2'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="zero",workload_uid="zero"}'
        values: '10 10 stale'
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter",namespace="ns",workload_name="pod-root",workload_uid="pod-root"}'
        values: '10 10 stale'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",workload_name="pod-root",workload_uid="pod-root",pod_name="pod",pod_uid="pod-uid",observation_valid="true"}'
        values: '1 stale'
    promql_expr_test:
      # dashboard-expression: workload-overview.json 102 A
      - expr: &dashboard_mappings |-
          sum((count by (job, namespace, workload_name, workload_uid) (dsx:pod_attribution:unique{job=~"exporter", namespace=~"ns", workload_name=~".*", observation_valid="true"}) or on (job, namespace, workload_name, workload_uid) (0 * dsx:workload:observed{job=~"exporter", namespace=~"ns", workload_name=~".*"}))) and on () (min(up{job=~"exporter"}) == 1)
        eval_time: 0m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: *dashboard_mappings
        eval_time: 1m
        exp_samples:
          - labels: '{}'
            value: 0
      - expr: *dashboard_mappings
        eval_time: 2m
        exp_samples: []

  - name: GPU utilization validates both bounds before attribution and preserves measured zero
    interval: 1m
    input_series:
      - series: 'up{job="exporter",instance="a"}'
        values: '1x4'
      - series: 'up{job="dcgm",instance="a"}'
        values: '1 0 stale 1 1'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="active",pod_uid="active",workload_name="mixed",workload_uid="mixed",observation_valid="true"}'
        values: '1x4'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="idle",pod_uid="idle",workload_name="mixed",workload_uid="mixed",observation_valid="true"}'
        values: '1x4'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="zero",pod_uid="zero",workload_name="zero",workload_uid="zero",observation_valid="true"}'
        values: '1x4'
      - series: 'dsx_workload_pod_info{job="exporter",namespace="ns",pod_name="high",pod_uid="high",workload_name="high",workload_uid="high",observation_valid="true"}'
        values: '1x4'
