  - name: Root Pod is excluded from children and keeps only the root fallback
    interval: 1m
    input_series:
      - series: 'dsx_workload_created_timestamp_seconds{job="exporter", namespace="ns", workload_name="root", workload_uid="multi"}'
        values: 1x1
      - series: 'dsx_workload_pod_info{component="self", component_instance="self", job="exporter", namespace="ns", observation_valid="true", pod_name="multi", pod_uid="multi", replica_group_id="group0", workload_name="root", workload_uid="multi"}'
        values: 1x1
    promql_expr_test:
      - expr: *layout_leaves
        eval_time: 1m
        exp_samples:
          - labels: '{job="exporter", layout_path="root|ns|multi", namespace="ns", workload_name="root", workload_uid="multi"}'
            value: 0
      - expr: *layout_ancestors
        eval_time: 1m
        exp_samples:
          - labels: '{id="workload|ns|multi", job="exporter", layout_offset="0", layout_path="root|ns|multi", namespace="ns", workload_name="root", workload_uid="multi"}'
            value: 0
