# Attribution for GPUs shared through a scheduler reservation Pod.
# Requires three configured labels on dsx_workload_pod_info:
#   gpu_group: the sharing group label the scheduler stamps on every Pod of the group
#   gpu_uuid:  the device UUID the reservation Pod records on itself
#   node:      spec.nodeName of the Pod, on reservation and consumer rows alike
# Consumers carry gpu_group and node; the reservation Pod carries all three. A sharing
# group is identified by (gpu_group, node): the scheduler keeps one reservation Pod per
# node and group, and a group value can appear on more than one node.
# Optional fourth label, pod_phase (object.status.phase of the Pod): when present,
# terminated consumers are excluded from the share. Without it every row is kept.

groups:
  - name: dsx-shared-gpu-attribution
    interval: 30s
    rules:
      - record: dsx:pod_attribution:unique
        expr: |
          max by (job, namespace, pod_name, pod_uid, workload_name, workload_group, workload_version,
                  workload_kind, workload_uid, owner_resolution, component, component_instance,
                  replica_group_id, observation_valid, team, gpu_group, gpu_uuid, node, pod_phase) (
            dsx_workload_pod_info
          )
          and on (job, namespace, pod_name)
          (count by (job, namespace, pod_name) (
            group by (job, namespace, pod_name, pod_uid, workload_name, workload_group, workload_version,
                      workload_kind, workload_uid, owner_resolution, component, component_instance,
                      replica_group_id, observation_valid, team, gpu_group, gpu_uuid, node, pod_phase) (
              dsx_workload_pod_info
            )
          ) == 1)

      # Every valid reservation row whose annotation is a device UUID, keyed by the DCGM
      # UUID label and the (gpu_group, node) sharing group. Annotation values of another
      # shape (a device index, a MIG id) are left out, so their groups stay unmapped.
      # Not a join key: a group can show two devices, or a device two groups, during a
      # reservation swap. The guarded rule below is the join key.
      - record: dsx:shared_gpu_device:candidate
        expr: |
          max by (UUID, gpu_group, node) (
            label_replace(
              dsx:pod_attribution:unique{observation_valid="true",gpu_group!="",gpu_uuid=~"GPU-.+"},
              "UUID", "$1", "gpu_uuid", "(GPU-.+)"
            )
          )

      # One row per shared device, kept only while device and sharing group map one to
      # one in both directions. An ambiguous pair would otherwise fail the fan-out join
      # for every group at once.
      - record: dsx:shared_gpu_device:group
        expr: |
          dsx:shared_gpu_device:candidate
          and on (gpu_group, node)
            (count by (gpu_group, node) (dsx:shared_gpu_device:candidate) == 1)
          and on (UUID)
            (count by (UUID) (dsx:shared_gpu_device:candidate) == 1)

      # Device and sharing group pairs excluded by the one-to-one guard.
      - record: dsx:shared_gpu_device:ambiguous
        expr: |
          dsx:shared_gpu_device:candidate
          unless on (UUID, gpu_group, node)
            dsx:shared_gpu_device:group

      # Consumers observed in each sharing group right now. Exclude the reservation
      # namespace (kai-resource-reservation by default; replace when configured
      # differently) so an unannotated reservation Pod during a swap is not counted as a
      # consumer. This selector and the fan-out selector below must stay identical, or
      # device time leaks from the shares.
      - record: dsx:shared_gpu_group:consumers
        expr: |
          count by (gpu_group, node) (
            dsx:pod_attribution:unique{observation_valid="true",namespace!="kai-resource-reservation",gpu_group!="",gpu_uuid="",pod_phase!~"Succeeded|Failed"}
          )

      # Utilization of each mapped shared device. One series per device, with its
      # sharing group.
      - record: dsx:shared_gpu_util:device
        expr: |
          max by (UUID) (DCGM_FI_DEV_GPU_UTIL)
          * on (UUID) group_left (gpu_group, node)
            dsx:shared_gpu_device:group

      # Device utilization copied onto every consumer of that device. Rows with
      # component="<unknown>" stay: the Pod belongs to a verified workload root and only
      # its component is unresolved. Filter component downstream when grouping by it.
      - record: dsx:shared_gpu_util:by_consumer
        expr: |
          dsx:shared_gpu_util:device
          * on (gpu_group, node) group_right (UUID)
            dsx:pod_attribution:unique{observation_valid="true",namespace!="kai-resource-reservation",gpu_group!="",gpu_uuid="",pod_phase!~"Succeeded|Failed"}

      # Equal split of the device value across the consumers present.
      - record: dsx:shared_gpu_util:equal_share
        expr: |
          dsx:shared_gpu_util:by_consumer
          / on (gpu_group, node) group_left
            dsx:shared_gpu_group:consumers

      # Shared devices whose sharing group has no observed consumer.
      - record: dsx:shared_gpu_device:unattributed
        expr: |
          dsx:shared_gpu_device:group
          unless on (gpu_group, node)
            dsx:shared_gpu_group:consumers

      # Sharing groups with consumers but no usable reservation row: reservation namespace
      # not selected, core-pod-v1 not selected, row invalid or rejected, annotation not a
      # device UUID, or pair ambiguous. The value is the number of consumers waiting.
      - record: dsx:shared_gpu_group:unmapped_consumers
        expr: |
          dsx:shared_gpu_group:consumers
          unless on (gpu_group, node)
            dsx:shared_gpu_device:group

      # Mapped shared devices with no DCGM measurement right now.
      - record: dsx:shared_gpu_device:unmeasured
        expr: |
          dsx:shared_gpu_device:group
          unless on (UUID)
            dsx:shared_gpu_util:device
