      - series: 'dsx_workload_pod_info{namespace="kai-resource-reservation",pod_name="gpu-reservation-1a2b3c4d",pod_uid="res-1",workload_name="gpu-reservation-1a2b3c4d",workload_version="v1",workload_kind="Pod",workload_uid="res-1",owner_resolution="resolved",component="pod",observation_valid="true",gpu_group="g-1",node="node-1",gpu_uuid="3"}'
        values: '1x12'
      - series: 'dsx_workload_pod_info{namespace="team-b",pod_name="runner-0",pod_uid="r-0",workload_name="runner-pool",workload_group="apps",workload_version="v1",workload_kind="Deployment",workload_uid="pool-1",owner_resolution="resolved",component="deployment",observation_valid="true",gpu_group="g-1",node="node-1"}'
