apiVersion: batch/v1
kind: Job
metadata:
  name: recovered
  namespace: exporter-workloads-denied
spec:
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
        - name: work
          image: busybox:1.37.0
          command: [sh, -c, 'sleep 3600']
