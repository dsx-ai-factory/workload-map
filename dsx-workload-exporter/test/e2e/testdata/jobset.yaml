apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: component-jobs
  namespace: exporter-workloads-a
  labels: {team: root-team}
spec:
  replicatedJobs:
    - name: workers
      replicas: 2
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels: {exporter-e2e-case: jobset, team: pod-team}
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 1
              containers:
                - name: work
                  image: busybox:1.37.0
                  command: [sh, -c, 'until test -f /tmp/finish; do sleep 0.1; done']
                  resources:
                    requests: {cpu: 10m, memory: 16Mi}
                    limits: {cpu: 100m, memory: 32Mi}
    - name: evaluator
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            metadata:
              labels: {exporter-e2e-case: jobset, team: pod-team}
            spec:
              restartPolicy: Never
              terminationGracePeriodSeconds: 1
              containers:
                - name: work
                  image: busybox:1.37.0
                  command: [sh, -c, 'until test -f /tmp/finish; do sleep 0.1; done']
                  resources:
                    requests: {cpu: 10m, memory: 16Mi}
                    limits: {cpu: 100m, memory: 32Mi}
