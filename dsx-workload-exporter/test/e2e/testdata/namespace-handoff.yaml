apiVersion: v1
kind: Namespace
metadata:
  name: exporter-workloads-handoff
  labels: {exporter-e2e-shard: a}
---
apiVersion: v1
kind: Pod
metadata:
  name: shard-probe
  namespace: exporter-workloads-handoff
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: work
      image: busybox:1.37.0
      command: [sh, -c, 'sleep 3600']
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shard-job
  namespace: exporter-workloads-handoff
spec:
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 1
      containers:
        - name: work
          image: busybox:1.37.0
          command: [sh, -c, 'sleep 3600']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shard-deployment
  namespace: exporter-workloads-handoff
spec:
  replicas: 0
  selector:
    matchLabels: {app: shard-deployment}
  template:
    metadata:
      labels: {app: shard-deployment}
    spec:
      containers:
        - name: work
          image: busybox:1.37.0
          command: [sh, -c, 'sleep 3600']
