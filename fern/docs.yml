# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

# TODO: the instance URL and custom domain are placeholders. Replace them with
# the values registered for this site before publishing.
instances:
  - url: nvidia-workload-map.docs.buildwithfern.com/workload-map
    custom-domain: docs.nvidia.com/workload-map

title: NVIDIA Workload Map Documentation

global-theme: nvidia

logo:
  right-text: Workload Map

check:
  rules:
    broken-links: error

redirects:
  - source: /workload-map/getting-started/quickstarts/quickstart-go-library
    destination: /workload-map/tutorials/read-and-modify-workloads-offline
  - source: /workload-map/building-on-workload-map/build-a-controller/tutorial-build-a-controller-on-kind
    destination: /workload-map/tutorials/build-a-controller-on-kind
  - source: /workload-map/building-on-workload-map/build-a-controller/watch-another-workload-type
    destination: /workload-map/tutorials/build-a-controller-on-kind#watch-another-workload-type

navbar-links:
  - type: github
    value: https://github.com/dsx-ai-factory/workload-map

navigation:
  - page: Home
    path: ../docs/index.mdx
    slug: /
  - changelog: ./changelog
    title: Release Notes
    slug: release-notes
  - section: Overview
    slug: overview
    contents:
      - page: What is Workload Map?
        path: ../docs/about/what-is-workload-map.mdx
        slug: what-is-workload-map
      - page: Core Concepts
        path: ../docs/about/core-concepts.mdx
        slug: core-concepts
      - page: Key Features
        path: ../docs/about/key-features.mdx
        slug: key-features
      - page: Architecture Overview
        path: ../docs/about/architecture-overview.mdx
        slug: architecture-overview
  - section: Getting Started
    contents:
      - page: Prerequisites
        path: ../docs/getting-started/prerequisites.mdx
        slug: prerequisites
      - page: Installation
        path: ../docs/getting-started/installation.mdx
        slug: installation
      - section: Quickstarts
        slug: quickstarts
        contents:
          - page: CLI
            path: ../docs/getting-started/quickstarts/quickstart-cli.mdx
            slug: quickstart-cli
      - page: Tutorial - Write Your First Workload Definition
        path: ../docs/getting-started/tutorial-write-your-first-workload-definition.mdx
        slug: tutorial-write-your-first-workload-definition
  - section: Tutorials
    slug: tutorials
    contents:
