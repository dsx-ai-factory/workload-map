operator:
  enabled: false
crdUpgrader:
  enabled: false
exporter:
  enabled: true
  image:
    repository: local/dsx-workload-exporter
    pullPolicy: Never
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: dashboard-lab
    matchExpressions: []
  kartaDefinitionSource:
    cluster:
      enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
