apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-active
  namespace: dashboard-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpu-active
  template:
    metadata:
      labels:
        app: gpu-active
      annotations:
        run.ai/simulated-gpu-utilization: '80'
        gpu-fraction: '0.25'
    spec:
      containers:
      - name: main
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - sleep 2147483647
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
            nvidia.com/gpu: '1'
          limits:
            cpu: 100m
            memory: 64Mi
            nvidia.com/gpu: '1'
---
