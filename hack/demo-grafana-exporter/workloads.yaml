---
apiVersion: v1
kind: Pod
metadata:
  name: gpu-quiet
  namespace: dashboard-lab
  annotations:
    run.ai/simulated-gpu-utilization: '2'
    gpu-fraction: '0.125'
spec:
  containers:
  - name: main
    image: busybox:1.37.0
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 2147483647
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
        nvidia.com/gpu: '1'
      limits:
        cpu: 100m
        memory: 64Mi
        nvidia.com/gpu: '1'
---
apiVersion: batch/v1
kind: Job
metadata:
  name: completed
  namespace: dashboard-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: completed
    spec:
      containers:
      - name: main
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - echo dashboard-test-completed; exit 0
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: failed
  namespace: dashboard-lab
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: failed
    spec:
      containers:
      - name: main
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - echo dashboard-test-failed; exit 1
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      restartPolicy: Never
