# Smoke test for the Argo Rollouts install: a minimal canary Rollout that must
# reach .status.phase=Healthy before the e2e suite relies on it.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollout-smoke
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: rollout-smoke
  strategy:
    canary:
      steps: []
  template:
    metadata:
      labels:
        app: rollout-smoke
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 2
            periodSeconds: 3
