#
# Smoke test for the LLMInferenceService controller that ships inside kserve.yaml:
# up.sh creates this router-less service and waits for Ready. The main container
# is a tiny CPU http server answering the preset's /health probe, and the model
# is an empty claim mounted read-only, so no GPU, model download, or credentials
# are needed. If the llmisvc controller or its webhooks are broken, up.sh fails
# here rather than mid-suite.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kserve-llmisvc-smoke-model
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: kserve-llmisvc-smoke
  namespace: default
spec:
  model:
    uri: pvc://kserve-llmisvc-smoke-model
    name: kserve-smoke/fake-model
  replicas: 1
  template:
    containers:
      - name: main
        image: busybox:1.36
        securityContext:
          runAsUser: 65532
        command: ["sh", "-c", "mkdir -p /tmp/www && echo ok > /tmp/www/health && exec busybox httpd -f -p 8000 -h /tmp/www"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 50m, memory: 32Mi}
