apiVersion: v1
kind: Pod
metadata:
  name: kueue-smoke
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: karta-e2e
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:1.36
      command: [sleep, "600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 10m, memory: 16Mi}
