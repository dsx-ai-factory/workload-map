apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
metadata:
  name: cloneset-smoke
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloneset-smoke
  template:
    metadata:
      labels:
        app: cloneset-smoke
    spec:
      automountServiceAccountToken: false
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 1
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
