#
# Pod -> Job -> JobSet. The exporter reads the intermediate Job with a GET.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: train-{{ .Replica }}
  labels:
    loadtest.karta/root: "true"
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: {{ .pods }}
          completions: {{ .pods }}
          backoffLimit: 1000
          template:
            spec:
              restartPolicy: Never
              nodeSelector:
                type: kwok
              tolerations:
                - key: kwok.x-k8s.io/node
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: trainer
                  image: {{ .image }}
