#
# A built-in batch/v1 CronJob pinned to Feb 31 - a date that never exists, so it can
# never fire and status.lastScheduleTime stays unset on any day. The Karta library
# reads an enabled, never-scheduled CronJob as Initializing.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: karta-e2e-cronjob
  namespace: default
spec:
  schedule: "0 0 31 2 *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["true"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
