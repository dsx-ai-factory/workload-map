#
# A JobSet with one long-running replicated Job. An active pod already reads Running (active or
# ready counts), and the pod sleeps well past the check so Running is stable. The readiness probe
# holds ready at 0 briefly so the bring-up window (active pods, none ready) appears in the frames.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: karta-e2e-jobset-running
  namespace: default
spec:
  replicatedJobs:
    - name: workers
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: worker
                  image: busybox:1.36
                  command: ["sh", "-c", "sleep 300"]
                  readinessProbe:
                    exec:
                      command: ["true"]
                    initialDelaySeconds: 6
                    periodSeconds: 2
                  resources:
                    requests: {cpu: 50m, memory: 32Mi}
                    limits: {cpu: 50m, memory: 32Mi}
