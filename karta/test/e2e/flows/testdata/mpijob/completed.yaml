#
# A minimal MPIJob (kubeflow.org/v2beta1, served by the mpi-operator). The launcher runs `true`
# and completes, so the job reaches a stable Succeeded condition on a CPU-only kind cluster.
# cleanPodPolicy None keeps the worker pod so the component extraction still finds it.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: karta-e2e-mpi
  namespace: default
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: None
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-launcher
              image: busybox:1.36
              command: ["true"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-worker
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
