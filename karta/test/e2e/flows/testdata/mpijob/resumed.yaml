#
# An MPIJob created suspended (runPolicy.suspend true), then resumed by the e2e action clearing
# spec.runPolicy.suspend. The launcher then sleeps and the mpi-operator marks it Running. The resumed
# flow records Suspended -> Running.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: karta-e2e-mpi-resumed
  namespace: default
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: None
    suspend: true
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-launcher
              image: busybox:1.36
              command: ["sh", "-c", "sleep 300"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-worker
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
