#
# A bare Pod pinned to a nonexistent node via nodeSelector, so it can never schedule
# and stays status.phase=Pending. The Karta library reads Pending as Initializing. The
# fixed "didn't match node selector" scheduler message is independent of cluster
# capacity, keeping the recorded status stable.
apiVersion: v1
kind: Pod
metadata:
  name: karta-e2e-pod-initializing
  namespace: default
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: karta-e2e-no-such-node
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 2Gi}
