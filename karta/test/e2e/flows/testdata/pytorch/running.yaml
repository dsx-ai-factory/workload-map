#
# A minimal PyTorchJob (1 master + 1 worker) whose containers sleep, so the
# Kubeflow training-operator marks it Running on a CPU-only kind cluster. The
# container must be named "pytorch" for the training-operator to manage it.
apiVersion: kubeflow.org/v1
kind: PyTorchJob
metadata:
  name: karta-e2e-pytorch
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      restartPolicy: Never
      template:
        spec:
          containers:
            - name: pytorch
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
