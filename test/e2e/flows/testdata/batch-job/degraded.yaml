#
# One index fails after both Pods can become ready. The other stays healthy while
# the failed index waits for retry backoff, exposing a real partial failure.
apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-job-degraded
  namespace: default
spec:
  completionMode: Indexed
  completions: 2
  parallelism: 2
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "if [ \"$JOB_COMPLETION_INDEX\" = \"0\" ]; then sleep 15; exit 1; else sleep infinity; fi"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 50m, memory: 32Mi}
