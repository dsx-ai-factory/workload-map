#
# A CloneSet of 3 replicas with hostname podAntiAffinity on a 2-worker cluster: two pods schedule
# (one per node), the third can never place. CloneSet creates all pods at once, so readyReplicas
# settles at 2 while spec.replicas is 3 — a partial availability the Karta definition reads as
# Initializing (not-converged). Unlike StatefulSet, CloneSet has no Degraded mapping because
# FailedScale/FailedUpdate conditions are set once and never cleared by the controller.
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
metadata:
  name: karta-e2e-cloneset-degraded
spec:
  replicas: 3
  selector:
    matchLabels: {app: karta-e2e-cloneset-degraded}
  template:
    metadata:
      labels: {app: karta-e2e-cloneset-degraded}
    spec:
      automountServiceAccountToken: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels: {app: karta-e2e-cloneset-degraded}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 20m, memory: 32Mi}
