#
# A 3-replica CloneSet for partition canary recording: the test sets
# spec.updateStrategy.partition=2 and changes the image, so only 1 pod
# (replicas - partition) rolls to the new revision. The Karta expression reads
# Running once updatedReplicas >= expectedUpdatedReplicas.
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
metadata:
  name: karta-e2e-cloneset-partition
spec:
  replicas: 3
  selector:
    matchLabels: {app: karta-e2e-cloneset-partition}
  template:
    metadata:
      labels: {app: karta-e2e-cloneset-partition}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 20m, memory: 32Mi}
