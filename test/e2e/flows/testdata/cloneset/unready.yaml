#
# A 3-replica CloneSet whose readiness probe always fails: all pods schedule and
# run, but none become ready. readyReplicas stays at 0 while spec.replicas is 3.
# The Karta definition reads this as Initializing (not Running). CloneSet has no
# Degraded mapping because FailedScale and FailedUpdate conditions are set once
# and never cleared by the controller.
apiVersion: apps.kruise.io/v1alpha1
kind: CloneSet
metadata:
  name: karta-e2e-cloneset-unready
spec:
  replicas: 3
  selector:
    matchLabels: {app: karta-e2e-cloneset-unready}
  template:
    metadata:
      labels: {app: karta-e2e-cloneset-unready}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "sleep infinity"]
        readinessProbe:
          exec:
            command: ["false"]
        resources:
          requests: {cpu: 20m, memory: 32Mi}
          limits: {cpu: 20m, memory: 32Mi}
