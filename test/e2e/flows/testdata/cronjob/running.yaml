#
# A CronJob scheduled every minute. Once it fires, its Job sleeps for 30 seconds,
# so status.lastScheduleTime is set and status.active holds the Job while the
# recorder captures it. The Karta library reads a fired, enabled CronJob as
# Running (lastScheduleTime != null). A distinct name keeps it from colliding
# with the other CronJob flows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: karta-e2e-cronjob-running
  namespace: default
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 30"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
