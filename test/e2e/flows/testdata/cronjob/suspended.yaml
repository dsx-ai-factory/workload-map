#
# A CronJob scheduled every minute, created enabled. The flow waits for it to fire (Running),
# then patches spec.suspend to true, and the Karta library reads the fired, suspended CronJob
# as Suspended. A distinct name keeps it from colliding with the other CronJob flows.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: karta-e2e-cronjob-suspended
  namespace: default
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 30"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
