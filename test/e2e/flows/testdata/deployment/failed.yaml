#
# A Deployment whose container exits immediately and whose readiness probe always fails, so no
# replica ever counts ready. With progressDeadlineSeconds 10 the controller gives up quickly and
# sets Progressing=False with reason ProgressDeadlineExceeded, which the Karta library reads as Failed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karta-e2e-deploy-failed
  namespace: default
spec:
  replicas: 1
  progressDeadlineSeconds: 10
  selector:
    matchLabels: {app: karta-e2e-deploy-failed}
  template:
    metadata:
      labels: {app: karta-e2e-deploy-failed}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
          readinessProbe:
            exec:
              command: ["false"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 50m, memory: 32Mi}
