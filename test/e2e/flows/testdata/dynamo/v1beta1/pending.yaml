#
# The served v1beta1 form of the CPU mocker flow. The operator creates real
# workloads and reports their native state; no status fields are patched.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: karta-e2e-dynamo-initializing-v1beta1
  namespace: default
spec:
  components:
  - name: frontend
    type: frontend
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: busybox:99.99.99
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
  - name: decode
    type: decode
    replicas: 1
    podTemplate:
      spec:
        containers:
        - name: main
          image: busybox:99.99.99
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
          workingDir: /workspace
          command:
          - python3
          - -m
          - dynamo.mocker
          args:
          - --model-path
          - nvidia/Llama-3.1-8B-Instruct-FP8
          - --model-name
          - nvidia/Llama-3.1-8B-Instruct-FP8
          envFrom:
          - secretRef:
              name: hf-token-secret-v1beta1
