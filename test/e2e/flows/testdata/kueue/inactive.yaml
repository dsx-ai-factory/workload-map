apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  name: karta-e2e-kueue-inactive
  namespace: default
spec:
  active: false
  queueName: karta-e2e-kueue
  podSets:
    - name: main
      count: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: worker
              image: busybox:1.36
              command: ["true"]
              resources:
                requests:
                  cpu: 50m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
