apiVersion: batch/v1
kind: Job
metadata:
  name: karta-e2e-kueue-job
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: karta-e2e-kueue
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "600"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 32Mi
