#
# A service whose baseRefs names an LLMInferenceServiceConfig that does not
# exist. The preset merge fails with ConfigNotFound, PresetsCombined goes False,
# and the controller stops reconciling, so Ready stays Unknown. Without reading
# PresetsCombined this would sit at Initializing forever.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: karta-e2e-llmisvc-missing-preset
  namespace: default
spec:
  baseRefs:
    - name: karta-e2e-llmisvc-absent-preset
  model:
    uri: pvc://karta-e2e-llmisvc-model
    name: karta-e2e/fake-model
  replicas: 1
  template:
    containers:
      - name: main
        image: busybox:1.36
        # The preset pins runAsNonRoot and busybox defaults to root, so pick a
        # non-root uid; /tmp is the preset's writable emptyDir.
        securityContext:
          runAsUser: 65532
        command: ["sh", "-c", "mkdir -p /tmp/www && echo ok > /tmp/www/health && exec busybox httpd -f -p 8000 -h /tmp/www"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 50m, memory: 32Mi}
