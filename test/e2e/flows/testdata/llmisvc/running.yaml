# A router-less LLMInferenceService whose main container is overridden (by name,
# the preset merge is per container) with a tiny CPU http server, so no GPU and
# no real model are needed. The controller merges the well-known template
# preset, creates the main Deployment, and Ready aggregates WorkloadsReady via
# the Knative living condition set: Unknown while the pod comes up, True once
# the workload is ready. The preset's probes (httpGet /health on 8000) are
# inherited as-is; the fake server answers that path, so readiness is real.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: karta-e2e-llmisvc
  namespace: default
spec:
  model:
    uri: pvc://karta-e2e-llmisvc-model
    name: karta-e2e/fake-model
  replicas: 1
  template:
    containers:
      - name: main
        image: busybox:1.36
        # The preset pins runAsNonRoot and busybox defaults to root, so pick a
        # non-root uid; /tmp is the preset's writable emptyDir.
        securityContext:
          runAsUser: 65532
        command: ["sh", "-c", "mkdir -p /tmp/www && echo ok > /tmp/www/health && exec busybox httpd -f -p 8000 -h /tmp/www"]
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 50m, memory: 32Mi}
