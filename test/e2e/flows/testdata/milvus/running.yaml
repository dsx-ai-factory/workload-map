#
# A real standalone Milvus driven by the milvus-operator (installed by
# hack/e2e/up.sh). The operator brings up the in-cluster dependencies (a
# single-replica etcd and a standalone MinIO) and the Milvus standalone pod, then
# sets EtcdReady, StorageReady, MsgStreamReady, and MilvusReady; the test waits
# for MilvusReady. Kept lightweight (standalone mode, operator-default message stream) for local kind.
apiVersion: milvus.io/v1beta1
kind: Milvus
metadata:
  name: karta-e2e-milvus
  namespace: default
spec:
  mode: standalone
  dependencies:
    etcd:
      inCluster:
        values:
          replicaCount: 1
    storage:
      inCluster:
        values:
          mode: standalone
          # Milvus publishes this MinIO release for anonymous pulls.
          image:
            repository: docker.io/milvusdb/minio
            tag: RELEASE.2024-12-18T13-15-44Z
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 256Mi
  components:
    standalone:
      replicas: 1
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: 250m
          memory: 1Gi
