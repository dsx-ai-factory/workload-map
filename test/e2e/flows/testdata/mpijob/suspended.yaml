#
# An MPIJob created suspended (runPolicy.suspend true). The mpi-operator creates no pods and sets the
# Suspended condition, which the definition reads as Suspended. Karta must read it as Suspended.
apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: karta-e2e-mpi-suspended
  namespace: default
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: None
    suspend: true
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-launcher
              image: busybox:1.36
              command: ["true"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    Worker:
      replicas: 1
      template:
        spec:
          containers:
            - name: mpi-worker
              image: busybox:1.36
              command: ["sleep", "infinity"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
