#
# A bare Pod that runs `true` and exits 0, so status.phase settles Succeeded. The
# Karta library reads it as Completed. A distinct name avoids colliding with the
# other Pod flows.
apiVersion: v1
kind: Pod
metadata:
  name: karta-e2e-pod-completed
  namespace: default
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  initContainers:
    - name: init-wait
      image: busybox:1.36
      command: ["sh", "-c", "sleep 8"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 20m, memory: 2Gi}
  containers:
    - name: worker
      image: busybox:1.36
      command: ["sh", "-c", "sleep 10"]
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 100m, memory: 2Gi}
