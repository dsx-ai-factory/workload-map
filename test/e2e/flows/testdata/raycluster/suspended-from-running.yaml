#
# A RayCluster that comes up running and is then suspended by the flow (spec.suspend true).
# KubeRay deletes the head pod and sets status.state=suspended, which the definition reads as
# Suspended. Same head-only shape, probe override and preloaded ray-e2e:local image as
# running.yaml. The pods never call the API server (no autoscaler), so no token is mounted.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: karta-e2e-ray-suspended-from-running
  namespace: default
spec:
  rayVersion: "2.40.0"
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        automountServiceAccountToken: false
        containers:
          - name: ray-head
            image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: "1", memory: 2Gi}
            readinessProbe:
              tcpSocket: {port: 6379}
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30
            livenessProbe:
              tcpSocket: {port: 6379}
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
  workerGroupSpecs:
    - groupName: small
      replicas: 0
      minReplicas: 0
      maxReplicas: 1
      rayStartParams: {}
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - name: ray-worker
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 250m, memory: 512Mi}
                limits: {cpu: 250m, memory: 512Mi}
