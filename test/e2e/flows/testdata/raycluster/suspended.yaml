#
# A RayCluster created suspended (spec.suspend true). KubeRay brings up no pods and
# leaves status.state empty or "suspended", which the definition reads as Suspended.
# The head and worker templates are still extracted from the spec. Same head-only shape
# as running.yaml so the recorded extraction matches, only suspended.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: karta-e2e-ray-suspended
  namespace: default
spec:
  suspend: true
  rayVersion: "2.40.0"
  headGroupSpec:
    rayStartParams: {}
    template:
      spec:
        containers:
          - name: ray-head
            image: ray-e2e:local
            imagePullPolicy: IfNotPresent
            resources:
              requests: {cpu: 250m, memory: 1Gi}
              limits: {cpu: "1", memory: 2Gi}
            readinessProbe:
              tcpSocket: {port: 6379}
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30
            livenessProbe:
              tcpSocket: {port: 6379}
              initialDelaySeconds: 30
              periodSeconds: 10
              failureThreshold: 30
  workerGroupSpecs:
    - groupName: small
      replicas: 0
      minReplicas: 0
      maxReplicas: 1
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 250m, memory: 512Mi}
