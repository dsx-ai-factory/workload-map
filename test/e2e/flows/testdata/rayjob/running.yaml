#
# A RayJob whose entrypoint sleeps for 5 minutes, so KubeRay holds status.jobStatus=RUNNING long
# enough to record before it would finish. Same single-node ray-e2e:local cluster as completed.yaml.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: karta-e2e-rayjob-running
  namespace: default
spec:
  entrypoint: 'python -c "import time; time.sleep(300)"'
  shutdownAfterJobFinishes: false
  backoffLimit: 0
  rayClusterSpec:
    rayVersion: "2.40.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "1"
      template:
        spec:
          containers:
            - name: ray-head
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 500m, memory: 2Gi}
                limits: {cpu: "2", memory: 3Gi}
              readinessProbe:
                tcpSocket: {port: 8265}
                initialDelaySeconds: 15
                periodSeconds: 5
                failureThreshold: 90
    workerGroupSpecs:
      - groupName: small
        replicas: 0
        minReplicas: 0
        maxReplicas: 0
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: ray-e2e:local
                imagePullPolicy: IfNotPresent
                resources:
                  requests: {cpu: 250m, memory: 512Mi}
