#
# A RayJob that reaches RUNNING and is then suspended by the flow (spec.suspend true). The entrypoint
# sleeps for 5 minutes, so the job is still running when the suspend lands. KubeRay suspends a RayJob
# only when its cluster is embedded (spec.rayClusterSpec, not clusterSelector) and
# shutdownAfterJobFinishes is true; otherwise it marks the RayJob ValidationFailed. Same single-node
# ray-e2e:local cluster as running.yaml. The pods never call the API server (no autoscaler), so no
# token is mounted.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: karta-e2e-rayjob-suspended-from-running
  namespace: default
spec:
  entrypoint: 'python -c "import time; time.sleep(300)"'
  shutdownAfterJobFinishes: true
  backoffLimit: 0
  rayClusterSpec:
    rayVersion: "2.40.0"
    headGroupSpec:
      rayStartParams:
        num-cpus: "1"
      template:
        spec:
          automountServiceAccountToken: false
          containers:
            - name: ray-head
              image: ray-e2e:local
              imagePullPolicy: IfNotPresent
              resources:
                requests: {cpu: 500m, memory: 2Gi}
                limits: {cpu: "2", memory: 3Gi}
              readinessProbe:
                tcpSocket: {port: 8265}
                initialDelaySeconds: 15
                periodSeconds: 5
                failureThreshold: 90
    workerGroupSpecs:
      - groupName: small
        replicas: 0
        minReplicas: 0
        maxReplicas: 0
        rayStartParams: {}
        template:
          spec:
            automountServiceAccountToken: false
            containers:
              - name: ray-worker
                image: ray-e2e:local
                imagePullPolicy: IfNotPresent
                resources:
                  requests: {cpu: 250m, memory: 512Mi}
                  limits: {cpu: 250m, memory: 512Mi}
