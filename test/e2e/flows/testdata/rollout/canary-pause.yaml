#
# A canary Rollout with a timed pause step. The controller enters phase=Paused
# for the pause duration, then resumes and completes the rollout to Healthy.
# The 10s pause is long enough for the recorder to capture the Paused frame.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: karta-e2e-rollout-canary-pause
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: karta-e2e-rollout-canary-pause
  strategy:
    canary:
      steps:
        - pause: {duration: 10s}
  template:
    metadata:
      labels:
        app: karta-e2e-rollout-canary-pause
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 20m, memory: 32Mi}
