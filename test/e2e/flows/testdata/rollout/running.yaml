#
# A minimal canary Rollout that reaches phase=Healthy. The scaled flow drives it
# 1 -> 3 -> 1 replicas; Karta reads Running at each settled count.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: karta-e2e-rollout
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: karta-e2e-rollout
  strategy:
    canary:
      steps: []
  template:
    metadata:
      labels:
        app: karta-e2e-rollout
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 20m, memory: 32Mi}
