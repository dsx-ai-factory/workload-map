#
# A Sandbox that runs, is suspended through spec.operatingMode, and is resumed. The
# journey covers Running, Suspending/Suspended and back to Running.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: karta-e2e-sandbox-resumed
  namespace: default
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 50m, memory: 32Mi}
