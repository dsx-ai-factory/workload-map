#
# A Sandbox that starts and runs. The controller creates its pod and reports the Ready
# condition, which the Karta library reads as Initializing, then Running.
apiVersion: agents.x-k8s.io/v1beta1
kind: Sandbox
metadata:
  name: karta-e2e-sandbox-running
  namespace: default
spec:
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 50m, memory: 32Mi}
