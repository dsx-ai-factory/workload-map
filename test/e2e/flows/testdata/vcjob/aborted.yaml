#
# A Volcano Job with a lifecycle policy that aborts the job when any pod fails.
# The worker exits 1 after a short delay, triggering the PodFailed event and
# the AbortJob action, so the controller drives the job through Running to
# Aborting to Aborted, proving the Suspending and Suspended mappings.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: karta-e2e-vcjob-aborted
  namespace: default
spec:
  minAvailable: 1
  maxRetry: 0
  policies:
    - event: PodFailed
      action: AbortJob
  tasks:
    - name: worker
      replicas: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 5; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
