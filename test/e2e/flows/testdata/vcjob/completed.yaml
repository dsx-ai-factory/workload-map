#
# A Volcano Job with two named tasks whose containers exit 0, so the controller
# drives it through Running to Completed. The tasks have different replica
# counts and sleep durations to exercise distinct task extraction.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: karta-e2e-vcjob-completed
  namespace: default
spec:
  minAvailable: 3
  tasks:
    - name: worker
      replicas: 2
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 15"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    - name: helper
      replicas: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: helper
              image: busybox:1.36
              command: ["sh", "-c", "sleep 10"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
