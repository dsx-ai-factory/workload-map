#
# A Volcano Job with two named tasks. Both exit 1 after different delays,
# so the controller drives the job through Running to Failed once all pods
# have terminated.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: karta-e2e-vcjob-failed
  namespace: default
spec:
  minAvailable: 3
  tasks:
    - name: worker
      replicas: 2
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 15; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 50m, memory: 64Mi}
    - name: helper
      replicas: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: helper
              image: busybox:1.36
              command: ["sh", "-c", "sleep 20; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
