#
# A Volcano Job that fails quickly and restarts. A RestartJob lifecycle policy
# tells the controller to restart on pod failure, and maxRetry 3 gives it room.
# The job enters the Restarting phase with retries remaining
# (retryCount < maxRetry), proving the Initializing mapping for that branch.
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: karta-e2e-vcjob-restarting
  namespace: default
spec:
  maxRetry: 3
  minAvailable: 1
  policies:
    - event: PodFailed
      action: RestartJob
  tasks:
    - name: worker
      replicas: 1
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: worker
              image: busybox:1.36
              command: ["sh", "-c", "sleep 3; exit 1"]
              resources:
                requests: {cpu: 50m, memory: 32Mi}
                limits: {cpu: 50m, memory: 32Mi}
