apiVersion: v1
kind: Pod
metadata:
  name: karta-e2e-workload-running-worker
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: karta-e2e
    kueue.x-k8s.io/pod-group-name: karta-e2e-workload-running
  annotations:
    kueue.x-k8s.io/pod-group-total-count: "2"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  containers:
    - name: worker
      image: busybox:1.36
      command: [sleep, "600"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 10m, memory: 16Mi}
